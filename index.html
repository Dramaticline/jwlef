  /* ================= 事件绑定 ================= */

  function bindGlobal() {
    document.addEventListener('click', function (e) {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act;
      const fn = ACTIONS[act];
      if (fn) { e.preventDefault(); fn(el, e); }
    });

    // 底部导航
    L.$$('.tab').forEach(function (b) {
      b.addEventListener('click', function () {
        A.tab = b.dataset.tab;
        P.haptic('LIGHT');
        A.render();
        window.scrollTo(0, 0);
      });
    });

    // 输入即时保存（防抖）
    // 600ms 太长：切 tab 时 A.render() 重建 DOM，输入框的 value 会丢，
    // 而 autoSave 还在等定时器，最后一段输入就落不了盘。
    // 压到 250ms，并记录「待保存的输入」，切页/切后台前强制 flush。
    document.addEventListener('input', function (e) {
      const id = e.target.id;
      if (!id) return;
      A._pending = { id: id, val: e.target.value };
      clearTimeout(A._t);
      A._t = setTimeout(function () { A.flushPending(); }, 250);
    });
    // 页面进入后台 / 关闭时立即落盘，不等防抖
    ['visibilitychange', 'pagehide', 'blur'].forEach(function (ev) {
      window.addEventListener(ev, function () {
        if (ev === 'visibilitychange' && !document.hidden) return;
        A.flushPending();
      });
    });
    document.addEventListener('change', function (e) {
      if (e.target.type === 'range') {
        const map = { enRange: 'enNum', slRange: 'slNum', mdRange: 'mdNum', rvRange: 'rvNum',
          bdH: 'bdHNum', bdW: 'bdWNum', bdE: 'bdENum' };
        if (map[e.target.id]) {
          L.$('#' + map[e.target.id]).textContent =
            (e.target.id === 'bdE' ? '+' : '') + e.target.value;
          if (e.target.id.indexOf('bd') === 0) updateBodyPreview();
          else autoSave(e.target.id, e.target.value);
        }
      }
    });
  }

  function bindView() {
    // 本周条
    const strip = L.$('#weekStrip');
    if (strip) {
      L.weekDates().forEach(function (d) {
        const b = document.createElement('div');
        b.className = 'stat';
        b.innerHTML = '<div class="stat-n" style="font-size:15px">' + d.slice(5) + '</div><div class="stat-l">星期' + L.weekday(d) + '</div>';
        b.style.cursor = 'pointer';
        if (d === L.today()) b.style.borderColor = 'var(--brand)';
        b.addEventListener('click', async function () {
          if (d === L.today()) return;
          A.day = await V.loadDay(d);
          A.tab = 'work';
          A.render();
          P.toast('切到 ' + d + '（查看模式，改动仍会存到那一天）');
        });
        strip.appendChild(b);
      });
    }
    // vault 路径
    const vp = L.$('#vaultPath');
    if (vp) {
      g.P.documentsUri().then(function (uri) {
        vp.textContent = uri ? (uri + '/jwle-vault/') : '（浏览器环境）浏览器本地存储 · jwle-vault/';
      });
    }
  }

  /** 输入即存：直接改内存里的 day 并落盘 */
  async function autoSave(id, val) {
    const d = A.day;
    let hit = false;
    if (id === 'noteIn') { d.note = val; hit = true; }
    if (id === 'drainIn') { d.drain = val; hit = true; }
    if (id === 'chargeIn') { d.charge = val; hit = true; }
    if (id === 'factIn') { d.fact = val; hit = true; }
    if (id === 'needIn') { d.need = val; hit = true; }
    if (id === 'enRange') { d.energy = Number(val); hit = true; }
    if (id === 'slRange') { d.sleep = Number(val); hit = true; }
    if (id === 'mdRange') { d.mood = Number(val); hit = true; }
    if (id === 'rvRange') { A.review.relation = Number(val); A.review.week = L.weekKey(); await V.saveReview(A.review); return; }
    if (id === 'rvProgress') { A.review.progress = val; A.review.week = L.weekKey(); await V.saveReview(A.review); return; }
    if (id === 'rvDrain') { A.review.drain = val; A.review.week = L.weekKey(); await V.saveReview(A.review); return; }
    if (id === 'rvGood') { A.review.good = val; A.review.week = L.weekKey(); await V.saveReview(A.review); return; }
    if (id === 'rvChange') { A.review.change = val; A.review.week = L.weekKey(); await V.saveReview(A.review); return; }
    if (id === 'rvNext') { A.review.nextwant = val; A.review.week = L.weekKey(); await V.saveReview(A.review); return; }
    if (!hit) return;
    await V.saveDay(d);
    if (d.date === L.today()) updateHeader();
  }

  /** 把待保存的输入立刻落盘（不等防抖）。
      切 tab、切后台、页面隐藏前都必须调一次，否则最后 250ms 的输入会丢。 */
  A.flushPending = function () {
    clearTimeout(A._t);
    const p = A._pending;
    if (!p) return;
    A._pending = null;
    autoSave(p.id, p.val);
  };

  /** 拖身体参数滑块时，实时更新算出来的目标 */
  function updateBodyPreview() {
    const box = L.$('#bdPreview');
    if (!box) return;
    const g = V.waterGoal({
      height: Number(L.$('#bdH').value),
      weight: Number(L.$('#bdW').value),
      extra: Number(L.$('#bdE').value)
    });
    box.innerHTML = '算出来：<strong>' + g.goal + ' ml</strong><br>' +
      '<span class="hint">体表面积 ' + g.bsa + ' m² × 1500 = ' + g.base + ' ml，再加 ' + g.extra + ' ml' +
      (g.capped ? '<br>⚠ 超过安全上限，已截到 ' + g.cap + ' ml' : '') + '</span>';
  }

  /* ================= 动作表 ================= */

  const ACTIONS = {

    /* --- 引导 --- */
    'ob-start': async function () {
      A.settings.me = L.$('#obMe').value.trim() || '我';
      A.settings.partner = L.$('#obPartner').value.trim() || '你';
      A.settings.onboarded = true;
      await V.saveSettings(A.settings);
      await enterApp();
    },

    /* --- 导航 --- */
    'go-settings': function () { A.tab = 'settings'; A.render(); },
    'modal-close': function () { A.closeModal(); },

    /* --- 今日工作 --- */
    'tk-add': async function () {
      const inp = L.$('#tkNew');
      const t = inp.value.trim();
      if (!t) { P.toast('先写点什么', 'err'); return; }
      A.day.tasks.push({ id: L.uid('t'), text: t, done: false });
      inp.value = '';
      await V.saveDay(A.day);
      A.haptic('done');
      A.render(); updateHeader();
    },
    'tk-toggle': async function (el) {
      const i = Number(el.dataset.i);
      A.day.tasks[i].done = !A.day.tasks[i].done;
      await V.saveDay(A.day);
      /* 完成一件事应该"被接住"，取消勾选只要轻轻一下。
         旧代码两种情况都是 MEDIUM，摸起来没有任何区别。 */
      A.haptic(A.day.tasks[i].done ? 'done' : 'tap');
      A.render(); updateHeader();
    },
    'tk-del': async function (el) {
      const i = Number(el.dataset.i);
      A.day.tasks.splice(i, 1);
      await V.saveDay(A.day);
      A.haptic('warn');
      A.render(); updateHeader();
    },
    'tk-carry': async function () {
      const un = A.day.tasks.filter((t) => !t.done).map((t) => ({ id: L.uid('t'), text: t.text, done: false }));
      A.day.tasks = A.day.tasks.filter((t) => t.done);
      await V.saveDay(A.day);
      const tmr = await V.loadDay(L.addDays(A.day.date, 1));
      tmr.tasks = tmr.tasks.concat(un);
      await V.saveDay(tmr);
      P.toast('已挪 ' + un.length + ' 件到明天');
      A.render(); updateHeader();
    },
    'tk-clear': async function () {
      A.day.tasks.forEach((t) => { t.done = true; });
      await V.saveDay(A.day);
      A.render(); updateHeader();
    },

    /* --- 心情 --- */
    'mo-chip': async function (el) {
      const e = el.dataset.e;
      const i = A.day.emotions.indexOf(e);
      if (i >= 0) A.day.emotions.splice(i, 1); else A.day.emotions.push(e);
      await V.saveDay(A.day);
      A.render();
    },
    'mo-compose': function () {
      const d = A.day;
      let s = '';
      if (d.fact) s += '今天有一件事想跟你说：' + d.fact.trim() + '\n\n';
      if (d.emotions.length) s += '我的感受是' + d.emotions.join('、') + '。\n\n';
      if (d.need) s += '我想要的是：' + d.need.trim() + '\n\n';
      if (!s) { P.toast('先写点内容', 'err'); return; }
      s += '—— 不是要你立刻解决，只是想让你知道。';
      A.modal({ title: '可以发出去的话', body: '<textarea class="input" style="min-height:170px">' + L.esc(s) + '</textarea>' +
        '<p class="hint mt1">长按选中即可复制。也可以改到你顺口为止。</p>', okText: '好了' });
    },

    /* --- 矛盾工坊 --- */
    'cf-new': function () { A.openConflict(null); },
    'cf-open': function (el) { A.openConflict(el.dataset.id); },
    'cf-status': function (el) {
      if (!A._curConflict) return;
      A._curConflict.status = el.dataset.s;
      L.$$('[data-act="cf-status"]').forEach(function (b) {
        b.classList.toggle('on', b.dataset.s === el.dataset.s);
      });
    },
    'cf-letter': function () {
      const c = A._curConflict || {};
      let s = '想跟你聊一件事：' + (c.title || '') + '\n\n';
      if (c.fact) s += '【事情是这样】\n' + c.fact.trim() + '\n\n';
      if (c.feeling) s += '【我的感受】\n' + c.feeling.trim() + '\n\n';

  async function readSyncForm() {
    const sy = A.settings.sync;
    if (L.$('#wdUrl')) {
      const raw = L.$('#wdUrl').value.trim();
      // 提前拦下 http:// —— 让用户在界面上就看到原因，
      // 而不是等同步时报一个看不懂的错
      if (/^http:\/\//i.test(raw)) {
        P.toast('只接受 https:// 地址，http 会让口令以明文走网络', 'err');
        throw new Error('insecure url');
      }
      sy.webdav.url = raw;
    }
    if (L.$('#wdUser')) sy.webdav.user = L.$('#wdUser').value.trim();

    /* 凭据：输入框留空表示"不修改"，沿用安全存储里已有的值。
       这样每次打开设置页都不会把口令回显到 DOM 里。 */
    if (!A.settings.creds) A.settings.creds = { webdavPass: '', githubToken: '' };
    const pIn = L.$('#wdPass');
    if (pIn && pIn.value) A.settings.creds.webdavPass = pIn.value;
    const tIn = L.$('#ghToken');
    if (tIn && tIn.value) A.settings.creds.githubToken = tIn.value;

    if (L.$('#ghGist')) sy.github.gistId = L.$('#ghGist').value.trim();
    await V.saveSettings(A.settings);
  }

  /* ================= 弹层 ================= */

  A.modal = function (o) {
    L.$('#modalTitle').textContent = o.title || '';
    L.$('#modalBody').innerHTML = o.body || '';
    const foot = L.$('#modalFoot');
    foot.innerHTML = '';
    const mk = function (txt, cls, fn) {
      const b = document.createElement('button');
      b.className = 'btn ' + (cls || '');
      b.textContent = txt;
      b.addEventListener('click', fn);
      foot.appendChild(b);
      return b;
    };
    if (o.okText) mk(o.okText, 'primary', async function () {
      if (o.onOk) await o.onOk();
      if (o.keepOpen !== true) A.closeModal();
    });
    if (o.cancelText) mk(o.cancelText, '', function () { A.closeModal(); });

    const m = L.$('#modal');
    m.classList.remove('hidden');
    // 下一帧再加 .show，让 transition 有起点可动。
    // 同一帧里同时满足"可见"和"到位"会跳过动画。
    requestAnimationFrame(function () { m.classList.add('show'); });

    /* 背后整体缩小：iOS 用它暗示"你面前是一层，不是新页面"。
       用 JS 加类名而不是 CSS :has()，兼容性更稳。 */
    const app = L.$('#app');
    if (app) app.classList.add('behind-sheet');

    A.bindSheetSwipe();
  };

  A.closeModal = function () {
    const m = L.$('#modal');
    if (!m || m.classList.contains('hidden')) return;
    m.classList.remove('show');
    const app = L.$('#app');
    if (app) app.classList.remove('behind-sheet');

    /* 等退场动画走完再 display:none。
       否则会直接消失，看起来像"闪一下"。 */
    const box = m.querySelector('.modal-box');
    const done = function () {
      m.classList.add('hidden');
      if (box) { box.style.transform = ''; box.style.transition = ''; }
      const mask = m.querySelector('.modal-mask');
      if (mask) mask.style.opacity = '';
    };
    clearTimeout(A._mt);
    A._mt = setTimeout(done, 300);
    A._curConflict = null;
  };

  /* 下滑关闭 —— iOS sheet 最重要的一条手势。
     只在抓手/标题区域起拖，避免和内容区滚动打架。 */
  A.bindSheetSwipe = function () {
    const box = L.$('#modal .modal-box');
    const mask = L.$('#modal .modal-mask');
    if (!box || box._swipeBound) return;
    box._swipeBound = true;

    const THRESHOLD = 100;   // 下滑超过 100px 就关闭
    let startY = 0, dy = 0, dragging = false;

    const onStart = function (e) {
      const t = e.target;
      if (!t.closest || (!t.closest('.grabber') && !t.closest('.modal-title'))) return;
      dragging = true;
      startY = e.touches[0].clientY;
      box.style.transition = 'none';
    };
    const onMove = function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      box.style.transform = 'translateY(' + dy + 'px)';
      if (mask) mask.style.opacity = String(Math.max(0, 1 - dy / 300));
    };
    const onEnd = function () {
      if (!dragging) return;
      dragging = false;
      box.style.transition = 'transform .25s cubic-bezier(.32,.72,0,1)';
      if (dy > THRESHOLD) {
        box.style.transform = 'translateY(100%)';
        if (A.haptic) A.haptic('tap');
        A.closeModal();
      } else {
        box.style.transform = '';
        if (mask) mask.style.opacity = '';
      }
      dy = 0;
    };

    box.addEventListener('touchstart', onStart, { passive: true });
    box.addEventListener('touchmove', onMove, { passive: true });
    box.addEventListener('touchend', onEnd);
    box.addEventListener('touchcancel', onEnd);
  };

  /* ================= 导入 ================= */

  /** 读取用户选的文件，判断类型，导入并汇报 */
  A.doImport = async function (file) {
    const name = file.name || '文件';
    P.toast('正在读取 ' + name + '…');

    let ab;
    try { ab = await file.arrayBuffer(); }
    catch (e) { P.toast('读取失败：' + e.message, 'err'); return; }

    const ext = (name.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();

    try {
      if (ext === 'zip') {
        const files = await L.readZip(ab);
        const md = files.filter((f) => /\.md$/i.test(f.path));
        // zip 里可能夹着同步包 JSON，也一并处理
        const js = files.filter((f) => /\.json$/i.test(f.path) && !/settings/i.test(f.path));
        let extra = 0;
        for (const j of js) {
          const r = await V.importBundle(new TextDecoder().decode(j.data));
          if (r.ok) extra += r.imported;
        }
        const r = await V.importFiles(md);
        A.afterImport(r, name, files.length, extra);

      } else if (ext === 'json') {
        const r = await V.importBundle(new TextDecoder().decode(new Uint8Array(ab)));
        if (!r.ok) { P.toast(r.msg, 'err'); return; }
        A.refreshAll();
        A.modal({
          title: '导入完成',
          body: '<div class="quote">从同步包里恢复了 ' + r.imported + ' 条记录。</div>' +
            '<p class="hint mt1">来源：' + L.esc(name) + '</p>',
          okText: '好'
        });

      } else if (ext === 'md') {
        const r = await V.importFiles([{ path: name, data: new Uint8Array(ab) }]);
        A.afterImport(r, name, 1, 0);

      } else {
        P.toast('不支持的文件类型：' + ext + '（只认 .zip / .md / .json）', 'err');
      }
    } catch (e) {
      P.toast('导入失败：' + (e.message || String(e)), 'err');
      console.error(e);
    }
  };

  A.afterImport = async function (r, name, fileCount, extra) {
    A.refreshAll();
    const d = r.detail || {};
    let h = '';
    if (r.imported > 0) {
      h += '<div class="quote">导入成功<br>' +
        '每日 ' + (d.day || 0) + ' 篇 · 议题 ' + (d.conflict || 0) + ' 条 · 复盘 ' + (d.review || 0) + ' 篇' +
        (extra ? ' · 同步包 ' + extra + ' 条' : '') + '</div>';
    } else {
      h += '<div class="quote warn">没有导入任何东西。<br>' +
        '可能是备份里的记录都比现在这台设备上的旧，或者文件格式不对。</div>';
    }
    if (r.skipped) h += '<p class="hint mt1">跳过了 ' + r.skipped + ' 条（本地已有更新的版本）。</p>';
    if (r.bad) h += '<p class="hint mt1">有 ' + r.bad + ' 个文件没认出来，已跳过。</p>';
    h += '<p class="hint mt1">来源：' + L.esc(name) + (fileCount > 1 ? '（zip 内 ' + fileCount + ' 个文件）' : '') + '</p>';

    A.modal({ title: '导入完成', body: h, okText: '好' });
  };

  /** 导入后把内存里的状态重新读一遍 */
  A.refreshAll = async function () {
    A.day = await V.loadDay(L.today());
    A.conflicts = await V.listConflicts();
    A.review = await V.loadReview(L.weekKey());
    updateHeader();
    if (A.tab !== 'settings') A.render();
  };

  g.App = A;
  document.addEventListener('DOMContentLoaded', function () { A.boot(); });
})(window);

/* ================= PWA：Service Worker 注册 ================= */
(function () {
  'use strict';

  // 注册 Service Worker（仅 https 或 localhost）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js')
        .then(function (reg) {
          console.log('[PWA] Service Worker 注册成功，作用域：', reg.scope);
        })
        .catch(function (err) {
          console.warn('[PWA] Service Worker 注册失败：', err);
        });
    });
  }

  // 在线/离线状态提示
  function updateOnlineStatus() {
    var toast = document.getElementById('toast');
    if (!toast) return;
    if (navigator.onLine) {
      toast.textContent = '已恢复在线';
      toast.className = 'toast show';
      setTimeout(function () { toast.className = 'toast'; }, 2000);
    } else {
      toast.textContent = '当前离线，数据仍会保存在本地';
      toast.className = 'toast show';
      setTimeout(function () { toast.className = 'toast'; }, 3000);
    }
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);

  // PWA 安装提示
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    console.log('[PWA] 可以安装了，调用 window.PWAInstall() 触发安装');
  });

  // 暴露全局安装方法（控制台调用，或自定义按钮调用）
  window.PWAInstall = function () {
    if (!deferredPrompt) {
      alert('当前浏览器不支持安装，或已安装过。\n可以手动：\n· Chrome: 菜单 → 安装 JWLE\n· Safari: 分享 → 添加到主屏幕');
      return;
    }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function (choice) {
      console.log('[PWA] 用户选择：', choice.outcome);
      deferredPrompt = null;
    });
  };

  // 监听已安装
  window.addEventListener('appinstalled', function () {
    console.log('[PWA] 应用已安装到桌面');
    var toast = document.getElementById('toast');
    if (toast) {
      toast.textContent = '已添加到主屏幕 ✓';
      toast.className = 'toast show';
      setTimeout(function () { toast.className = 'toast'; }, 2500);
    }
  });
})();

</script>
