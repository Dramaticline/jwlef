<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6efe9">
<meta name="description" content="JWLE —— 朝夕 · 一天的事，一天的了。本地优先的情侣日常记录 PWA">
<title>JWLE</title>

<!-- ================= PWA 必需 ================= -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JWLE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="JWLE">
<meta name="msapplication-TileColor" content="#f6efe9">
<meta name="msapplication-TileImage" content="/icons/icon-192.png">
<meta name="format-detection" content="telephone=no">

<style>
/* =========================================================
   朝夕 · DayByDay —— 样式
   设计原则：极简。一屏只做一件事，能不显示的就不显示。

   本文件的分层：
     ① 设计令牌（颜色 / 字号 / 间距 / 动效曲线）
     ② 基础重置
     ③ 组件
   组件里不再出现魔法数字，一律引用令牌。
   ========================================================= */

:root {
  /* ---------- 颜色 ---------- */
  --bg: #f6efe9;
  --card: #fffdfb;
  --ink: #2c2724;
  --ink2: #6b6058;
  /* 说明文字原为 #9a8d84，在 #f6efe9 上对比度仅 3.2:1，
     远低于 WCAG AA 的 4.5:1；而 .hint / .card-note / .item-s
     这类小字号说明文字大量使用它，低亮度屏上会明显发糊。
     实测选 #756c65：在背景上 4.51:1、在卡片白底上 5.06:1，两端都过。 */
  --ink3: #756c65;
  --brand: #c2705a;
  --brand-soft: #f0ddd6;
  --line: #e8ded6;
  --ok: #4a7c59;
  --warn: #b8860b;
  --danger: #a4453b;
  --ios-green: #34c759;

  /* ---------- 字号梯度（对齐 iOS type ramp） ----------
     原来有 12.5px 这种"半像素"值：在 2x/3x 屏上
     渲染引擎会在 25px 和 26px 之间反复切换，出现糊边。
     iOS 的梯度里不存在半个像素。 */
  --fs-title: 20px;   /* 顶栏日期        ← Title 3 附近 */
  --fs-head: 17px;    /* 卡片主标题      ← Headline */
  --fs-body: 15px;    /* 正文 / 输入框   ← Subhead  */
  --fs-sub: 14px;     /* 次级正文        ← Subhead 下沿 */
  --fs-foot: 13px;    /* 说明 / 标签     ← Footnote */
  --fs-caption: 12px; /* 极小组 / 徽标   ← Caption 1 */
  --fs-micro: 11px;   /* tabbar 文字     ← Caption 2 */

  --lh-tight: 1.3;
  --lh-body: 1.6;
  --lh-loose: 1.75;

  /* ---------- 间距（4px 网格） ----------
     原来只有 mt1=12 / mt2=18 两个值，粒度太粗，
     于是各处随手写 16 / 12 / 18 / 22，节奏就乱了。 */
  --sp1: 4px;
  --sp2: 8px;
  --sp3: 12px;
  --sp4: 16px;
  --sp5: 20px;
  --sp6: 24px;
  --sp7: 32px;

  /* ---------- 圆角 ---------- */
  --r-sm: 8px;
  --r: 14px;       /* 卡片 */
  --r-lg: 18px;    /* 弹层 */

  /* ---------- 动效 ----------
     iOS 的标准缓动是"快出慢入"，不是 ease。
     一个曲线统一全站，动画才不会各有各的脾气。 */
  --ease: cubic-bezier(.32, .72, 0, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --dur-fast: .15s;
  --dur: .25s;
  --dur-slow: .32s;

  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  font-size: var(--fs-body); line-height: var(--lh-body);
  overscroll-behavior-y: contain;
}
body { -webkit-font-smoothing: antialiased; }
.hidden { display: none !important; }

/* 图标：统一和文字对齐。
   SVG 默认是 inline，基线和文字不一致，会整体下沉约 2px。 */
.ico { display: block; }
.ti .ico { display: block; }
.row-inline { display: inline-flex; align-items: center; gap: 6px; }

/* 无障碍：系统开了"减弱动态效果"时，动画和过渡全部关掉。
   这是硬性要求，很多人（尤其前庭功能敏感者）默认开着它。 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- 首屏引导 ---------- */
.onboard {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 24px; padding-top: calc(24px + var(--safe-t));
  overflow-y: auto; z-index: 50;
}
.ob-inner { width: 100%; max-width: 420px; }
.ob-logo {
  font-size: 44px; font-weight: 300; letter-spacing: 6px;
  color: var(--brand); margin-bottom: 8px;
}
.ob-logo span { color: var(--ink3); }
.ob-title { font-size: 22px; font-weight: 600; margin: 0 0 6px; line-height: var(--lh-tight); }
.ob-sub { color: var(--ink2); font-size: var(--fs-sub); margin: 0 0 var(--sp5); }
.ob-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: var(--sp4); margin-bottom: var(--sp3);
}
.ob-note {
  font-size: var(--fs-foot); color: var(--ink3); line-height: var(--lh-loose);
  margin-bottom: var(--sp5); text-align: center;
}

/* ---------- 布局 ---------- */
.app {
  display: flex; flex-direction: column; height: 100%;
  transition: transform var(--dur-slow) var(--ease),
              border-radius var(--dur-slow) var(--ease);
  transform-origin: center top;
}
/* 弹层升起时，背后整体缩小并圆角 —— iOS 的层级暗示 */
.app.behind-sheet {
  transform: scale(.94);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--sp3) + var(--safe-t)) var(--sp4) var(--sp3);
  background: var(--bg); border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  transition: padding var(--dur) var(--ease);
}
.tb-date {
  font-size: var(--fs-title); font-weight: 700;
  letter-spacing: -.2px; line-height: var(--lh-tight);
}
.tb-sub { font-size: var(--fs-foot); color: var(--ink3); margin-top: 2px; }
/* 滚动后收起副标题，顶栏变矮 —— 用空间换层次 */
.topbar.compact { padding-top: calc(var(--sp2) + var(--safe-t)); padding-bottom: var(--sp2); }
.topbar.compact .tb-sub {
  opacity: 0; height: 0; margin: 0; overflow: hidden;
}
.tb-sub { transition: opacity var(--dur-fast), height var(--dur) var(--ease); }

.tb-btn {
  background: none; border: none; color: var(--ink2);
  width: 44px; height: 44px; padding: 0; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background-color var(--dur-fast);
}
.tb-btn:active { background: var(--brand-soft); }

.view {
  flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: var(--sp4) var(--sp4) calc(90px + var(--safe-b));
  animation: viewIn var(--dur) var(--ease);
}
@keyframes viewIn {
  from { opacity: 0; transform: translateX(8px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; background: var(--card);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b); z-index: 20;
}
.tab {
  flex: 1; background: none; border: none; padding: var(--sp2) 0 7px;
  min-height: 48px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink3); cursor: pointer; font-family: inherit;
  transition: color var(--dur-fast), background-color var(--dur-fast);
}
.tab .ti { font-size: 22px; line-height: 1; }
.tab .ti .ico { width: 22px; height: 22px; }
.tab .tl { font-size: var(--fs-micro); letter-spacing: .2px; }
.tab.on { color: var(--brand); }
.tab.on .ti .ico { stroke-width: 2.1; }   /* 选中态加粗，比换色更容易一眼分辨 */
.tab:active { background: var(--brand-soft); }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: var(--sp4); margin-bottom: var(--sp3);
}
.card-h { font-size: var(--fs-head); font-weight: 600; margin: 0 0 var(--sp1); line-height: var(--lh-tight); }
.card-note { font-size: var(--fs-foot); color: var(--ink3); margin: 0 0 var(--sp3); line-height: var(--lh-body); }

/* ---------- 表单 ---------- */
.lbl {
  display: block; font-size: var(--fs-foot); color: var(--ink2);
  margin-bottom: var(--sp1); font-weight: 500;
}
.mt1 { margin-top: var(--sp3); }
.mt2 { margin-top: var(--sp5); }

.input, textarea.input, select.input {
  width: 100%; padding: 11px var(--sp3); font-size: var(--fs-body); font-family: inherit;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); outline: none;
  transition: border-color var(--dur-fast);
}
.input:focus { border-color: var(--brand); }
textarea.input { min-height: 78px; resize: vertical; line-height: var(--lh-body); }
input[type=time].input { padding: var(--sp2) var(--sp3); }

.slider-row { display: flex; align-items: center; gap: var(--sp3); }
.slider-row .lb { font-size: var(--fs-foot); color: var(--ink2); flex: 0 0 auto; }
.slider-row input[type=range] { flex: 1; accent-color: var(--brand); }
.slider-row .num {
  flex: 0 0 auto; min-width: 46px; text-align: center;
  font-size: var(--fs-foot); font-weight: 600; color: var(--brand);
  background: var(--brand-soft); border-radius: var(--r-sm); padding: 2px 0;
}

/* ---------- 开关（iOS 风格，纯 CSS） ----------
   刻意保留原生 <input type="checkbox"> 的 DOM 结构，
   只把视觉藏起来重画。这样 app.js 里的 .checked 读取逻辑
   一行都不用改，可访问性也不丢。 */
.sw { display: none; }
.sw + .sw-ui {
  display: inline-block; flex: 0 0 auto;
  width: 51px; height: 31px; border-radius: 16px;
  background: var(--line); position: relative;
  transition: background-color var(--dur) var(--ease);
}
.sw + .sw-ui::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 27px; height: 27px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 5px rgba(0, 0, 0, .18);
  transition: transform var(--dur) var(--ease);
}
.sw:checked + .sw-ui { background: var(--ios-green); }
.sw:checked + .sw-ui::after { transform: translateX(20px); }
.sw:disabled + .sw-ui { opacity: .45; }

/* 开关所在的一整行：最小 44px 触控高度 */
.row {
  display: flex; align-items: center; gap: var(--sp3);
  min-height: 44px; cursor: pointer;
}
.row .row-t { flex: 1; font-size: var(--fs-body); }
.row .row-s { font-size: var(--fs-caption); color: var(--ink3); margin-top: 1px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px var(--sp4); font-size: var(--fs-sub); font-family: inherit;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); cursor: pointer;
  min-height: 40px;
  transition: transform var(--dur-fast), background-color var(--dur-fast);
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: #e5c9c5; }
.btn.big { width: 100%; padding: var(--sp3); font-size: var(--fs-head); min-height: 48px; }
.btn.sm { padding: 6px 11px; font-size: var(--fs-foot); min-height: 32px; }
.btn.block { width: 100%; }
.row-wrap { display: flex; flex-wrap: wrap; gap: var(--sp2); }

/* ---------- 触控热区 ----------
   iOS 的最小可点击区域是 44×44pt。下面这些控件视觉上很小，
   但用透明伪元素把热区撑到 44px —— 看起来没变，点得准了。
   这是无障碍要求，不是审美问题。 */
.tap44 { position: relative; }
.tap44::before {
  content: ''; position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 44px; height: 44px;
}

/* ---------- 任务 ---------- */
/* 横向留白说明：.task 左右各留 11px，专门给两侧 44px 热区让位。

   为什么容器必须让出这 11px：负外边距只影响**兄弟元素**的排布，
   不会把元素自身的右边界拉回来。修复前 `.task-del` 用
   margin:-11.5px 收窄，它的右边缘仍然溢出 11.5px，
   把 .task 的 scrollWidth 顶到 336 > 324（横向滚动条就是这么来的）。
   所以改成「容器先让出空间、两侧各自退回半个身位」，不依赖负 margin 算术。
   实测结果：clientWidth 324 = scrollWidth 324。 */
.task {
  display: flex; align-items: flex-start; gap: 0;
  padding: var(--sp3) 11px;
  border-bottom: .5px solid var(--line);   /* iOS hairline：0.5px 而非虚线 */
}
.task:last-child { border-bottom: none; }
/* 视觉尺寸 22px，触控尺寸 44px。
   做法：本体就是 44×44 的透明按钮（热区），再用负外边距把它
   在布局上收窄到 22px（44 − 11 − 11 = 22）。容器两侧各让出 11px，
   所以退回来的部分刚好落在内边距里，不产生溢出。 */
.task-chk {
  flex: 0 0 auto; position: relative;
  width: 44px; height: 44px; margin: -11px -11px -11px -11px;
  background: transparent; border: none; padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--dur-fast) var(--ease-spring);
}
/* 真正画出来的方块 */
.task-chk::after {
  content: ''; width: 22px; height: 22px;
  border: 1.5px solid var(--ink3); border-radius: 7px;
  background: transparent;
  transition: background-color var(--dur-fast), border-color var(--dur-fast);
}
.task-chk:active { transform: scale(1.15); }
.task-chk.on { animation: chkPop var(--dur) var(--ease-spring); }
@keyframes chkPop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.task-chk.on::after { background: var(--brand); border-color: var(--brand); }
/* 对勾：用背景图比再套一层伪元素稳，且不参与布局 */
.task-chk.on::before {
  content: ''; position: absolute; z-index: 1;
  width: 5px; height: 10px;
  margin-top: -3px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  pointer-events: none;
}
/* flex-basis 必须是 0，不能是 auto。
   设成 auto 时，浏览器先按内容宽度分配空间，再叠加两侧的
   负外边距，文本就不会主动收缩，会把 .task 顶出横向溢出。 */
.task-text {
  flex: 1 1 0; min-width: 0; margin-left: 10px;
  font-size: var(--fs-body); word-break: break-word;
}
.task.done .task-text { color: var(--ink3); text-decoration: line-through; }
/* 触控目标 ≥44px，视觉上仍是个 17px 的小叉。
   本体 44×44，负外边距退回 22px 参与布局；
   多出来的 22px 由 .task 左右各 11px 的内边距承接。 */
.task-del {
  flex: 0 0 auto; width: 44px; height: 44px;
  margin: -11px -11px -11px -11px;
  background: none; border: none; color: var(--ink3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: color var(--dur-fast), background-color var(--dur-fast);
}
.task-del:active { color: var(--danger); background: var(--brand-soft); }

/* ---------- 情绪 chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 7px var(--sp3); font-size: var(--fs-foot); border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink2); cursor: pointer;
  font-family: inherit; min-height: 32px;
  transition: background-color var(--dur-fast), color var(--dur-fast),
              border-color var(--dur-fast), transform var(--dur-fast);
}
.chip:active { transform: scale(.96); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ---------- 心情大数字 ---------- */
.mood-big {
  display: flex; align-items: baseline; justify-content: center; gap: var(--sp1);
  padding: 6px 0 2px;
}
.mood-num { font-size: 42px; font-weight: 300; color: var(--brand); line-height: 1; }
.mood-den { font-size: var(--fs-body); color: var(--ink3); }

/* ---------- 列表 ---------- */
.item {
  border: 1px solid var(--line); border-radius: 11px;
  padding: var(--sp3) 13px; margin-bottom: var(--sp2); background: var(--card);
  cursor: pointer;
  animation: itemIn var(--dur) backwards var(--ease);
}
.item:active { background: var(--brand-soft); }
.item-t { font-size: var(--fs-body); font-weight: 500; margin-bottom: 3px; }
.item-s { font-size: var(--fs-caption); color: var(--ink3); }
.item .badge {
  display: inline-block; font-size: var(--fs-micro); padding: 1px var(--sp2);
  border-radius: 999px; margin-left: 6px; vertical-align: 1px;
}
.badge.draft { background: #efe9e4; color: var(--ink2); }
.badge.sent { background: #dfe9f0; color: #3d6480; }
.badge.done { background: #e0efe4; color: var(--ok); }

/* 列表逐项淡入。用 backwards 而不是 both，
   否则动画结束后元素会停在末态。 */
@keyframes itemIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.item:nth-child(1) { animation-delay: .02s; }
.item:nth-child(2) { animation-delay: .04s; }
.item:nth-child(3) { animation-delay: .06s; }
.item:nth-child(4) { animation-delay: .08s; }
.item:nth-child(5) { animation-delay: .10s; }
.item:nth-child(6) { animation-delay: .12s; }
.item:nth-child(7) { animation-delay: .14s; }
.item:nth-child(n+8) { animation-delay: .16s; }

/* ---------- 提示块 ---------- */
.quote {
  border-left: 3px solid var(--brand); background: var(--brand-soft);
  padding: 10px 13px; border-radius: 0 10px 10px 0;
  font-size: var(--fs-foot); color: var(--ink2); line-height: var(--lh-body);
}
.quote.warn { border-color: var(--warn); background: #fdf5e0; }
.hint { font-size: var(--fs-foot); color: var(--ink3); line-height: var(--lh-loose); }

/* ---------- 空状态 ----------
   一个居中的灰字，信息量几乎为零。
   图标 + 标题 + 副标题，读起来是"等你开始"而不是"没东西"。 */
.empty { text-align: center; padding: var(--sp7) var(--sp5); color: var(--ink3); }
.empty-icon {
  width: 44px; height: 44px; margin: 0 auto var(--sp3);
  color: var(--ink3); opacity: .5;
  display: flex; align-items: center; justify-content: center;
}
.empty-title { font-size: var(--fs-sub); font-weight: 600; color: var(--ink2); margin-bottom: var(--sp1); }
.empty-sub { font-size: var(--fs-foot); }

/* ---------- 设置分组 ---------- */
.grp-t {
  font-size: var(--fs-caption); color: var(--ink3); letter-spacing: 1px;
  margin: var(--sp5) 0 var(--sp2); font-weight: 600;
}

/* ---------- 弹层 ---------- */
.modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; }
.modal-mask {
  position: absolute; inset: 0; background: rgba(30, 25, 22, .4);
  opacity: 0; transition: opacity var(--dur) var(--ease);
}
.modal.show .modal-mask { opacity: 1; }
.modal-box {
  position: relative; width: 100%; max-height: 86vh;
  background: var(--bg); border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: var(--sp2) var(--sp4) calc(var(--sp4) + var(--safe-b));
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(100%);
  transition: transform var(--dur-slow) var(--ease);
  will-change: transform;
}
.modal.show .modal-box { transform: translateY(0); }

/* 抓手：36×5 的横线，暗示"可以往下拖" */
.grabber {
  width: 36px; height: 5px; border-radius: 3px;
  background: var(--ink3); opacity: .3;
  margin: 0 auto var(--sp3); flex: 0 0 auto;
  touch-action: none;
}
.modal-title { margin: 0 0 var(--sp3); font-size: var(--fs-head); font-weight: 600; }
.modal-body { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.modal-foot { margin-top: var(--sp3); display: flex; gap: var(--sp2); }
.modal-foot .btn { flex: 1; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + var(--safe-b));
  transform: translateX(-50%) translateY(12px);
  background: rgba(44, 39, 36, .93); color: #fff;
  padding: 10px var(--sp4); border-radius: 10px; font-size: var(--fs-foot);
  max-width: 84vw; text-align: center; z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-fast), transform var(--dur) var(--ease);
  line-height: var(--lh-body);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); }

/* ---------- 深色 ----------
   原实现的 --ink2 是 "#ae a" —— 这是非法 CSS，会被浏览器整条丢弃，
   然后在下一行打了个补丁重新赋值。两处合并成一处。
   --ink3 原为 #8b817a，在 #1b1a19 上仅 4.6:1，勉强压线；
   提到 #a89d95（约 5.4:1）。 */
body.dark {

  --ink2: #aea49c; --ink3: #a89d95; --line: #373330;

}
body.dark .input { background: #2c2a27; border-color: #3d3936; }
body.dark .item { background: #242220; }
body.dark .tabbar { background: #201e1d; }
body.dark .chip { background: #2c2a27; border-color: #3d3936; }
body.dark .quote { background: #2a2320; }
body.dark .btn { background: #2c2a27; border-color: #3d3936; }
body.dark .btn.primary { background: var(--brand); border-color: var(--brand); color: #2a211d; }
body.dark .btn.ghost { background: transparent; }
body.dark .sw + .sw-ui { background: #3d3936; }
body.dark .task-chk { background: transparent; }
body.dark .badge.draft { background: #332f2c; color: var(--ink2); }
body.dark .badge.sent { background: #26333d; color: #86b3cf; }
body.dark .badge.done { background: #24352a; color: #7fbd8f; }

/* ---------- 饮水 ---------- */
.water-top { display: flex; align-items: baseline; justify-content: center; gap: var(--sp1); }
.water-cur { font-size: 32px; font-weight: 300; color: var(--brand); line-height: 1; }
.water-goal { font-size: var(--fs-sub); color: var(--ink3); }
.water-bar {
  height: 9px; background: var(--brand-soft); border-radius: 999px;
  overflow: hidden; margin: 10px 0 var(--sp1);
}
.water-fill {
  height: 100%; background: var(--brand); border-radius: 999px;
  transition: width .35s var(--ease); min-width: 0;
}
.water-pct { text-align: center; font-size: var(--fs-caption); color: var(--ink3); }
.cups { display: flex; gap: 7px; margin-top: var(--sp3); }
/* 原来 40px 高，低于 iOS 的 44px 下限。这些是高频点击的按钮
   （一天要按五六次），手指稍微偏一点就点不中。 */
.cups .btn { flex: 1; padding: 11px var(--sp1); font-size: var(--fs-foot); min-height: 44px; }
.water-logs {

  max-height: 92px; overflow-y: auto; line-height: var(--lh-loose);
}

/* ---------- 久坐 ---------- */
.sit-row { display: flex; align-items: center; gap: var(--sp3); }
.sit-num { font-size: 26px; font-weight: 300; color: var(--brand); line-height: 1; }
.sit-lbl { font-size: var(--fs-foot); color: var(--ink3); }
.sit-warn {
  font-size: var(--fs-foot); color: var(--warn); margin-top: var(--sp2);
  padding: 7px 10px; background: #fdf5e0; border-radius: var(--r-sm);
}
body.dark .sit-warn { background: #332b1d; }

/* ---------- 星期选择 ---------- */
.days { display: flex; gap: 5px; }
.days .chip { flex: 1; padding: 6px 0; text-align: center; font-size: var(--fs-foot); }

/* ---------- 小工具 ---------- */
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: var(--fs-caption); }
/* 路径框：原来用 dashed，全 App 只剩这一处虚线。
   iOS 里「可复制的内容块」是实心浅底 + 无边框或 hairline，不用虚线。
   虚线还容易被误读成「占位符 / 未填」。这里改成实心浅底。 */
.path-box {
  background: var(--card); border: none; border-radius: var(--r-sm);
  padding: 9px 11px; font-size: var(--fs-caption); color: var(--ink2);
  word-break: break-all; line-height: var(--lh-body);
}
body.dark .path-box { background: #2c2a27; }
.stat-row { display: flex; gap: 10px; text-align: center; margin: var(--sp1) 0 2px; }
.stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px var(--sp1); }

<!-- =========================================================
     Capacitor 运行时与插件
     ---------------------------------------------------------
     这一段必须存在，且 core 必须排在最前。

     这些文件由 scripts/sync-plugins.js 从 node_modules 复制而来。
     改动了插件版本后，要重新跑一次 npm run plugins:sync。

     漏掉任意一个，对应的原生能力就会静默失效（不会报错）。
     platform.js 里的启动断言会在这种情况下直接把问题喊出来。

<script>

/* ===== icons.js ===== */
/* =========================================================
   icons.js —— 内联 SVG 图标集
   ---------------------------------------------------------
   为什么不用 Unicode 字符（⚙ ◐ ♡ ⚯ ↻ ✓ ×）：

   1. 那些"符号"在不同安卓 ROM 上由不同的字体渲染。
      同一个 ⚯ 在小米、华为、三星上能长得完全不一样，
      甚至直接渲染成豆腐块。

   2. 它们的视觉重量不一致。⚙ 是实心的，◐ 是半实心的，
      ♡ 是描边的 —— 并排放在 tabbar 里会显得歪歪扭扭。

   3. 无法统一笔画粗细，也做不了"选中态填充"。

   内联 SVG 没有这些问题：
   - 24×24 统一 viewBox，1.8 统一 stroke-width
   - stroke="currentColor"，自动跟随 tab 的选中/未选中颜色
   - 不需要字体文件，不需要构建步骤

   用法：
     I.tab('work')        → tabbar 图标
     I.gear()             → 设置齿轮
     I.check() / I.close() → 小尺寸操作符
     I.empty('work')      → 空状态大图标

   新增图标照抄现有格式即可，务必保持 24×24 / 1.8 / round。
   ========================================================= */
(function (g) {
  'use strict';

  const I = {};

  /* 统一外壳。size 用 em 的倍数，方便跟随上下文字号缩放。 */
  function svg(inner, opt) {
    const o = opt || {};
    const size = o.size || 24;
    const sw = o.sw || 1.8;

      '<svg class="ico' + (o.cls ? ' ' + o.cls : '') + '" viewBox="0 0 24 24" ' +
      'width="' + size + '" height="' + size + '" ' +
      'fill="none" stroke="currentColor" ' +
      'stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true">' + inner + '</svg>'
    );

  /* ---------- tabbar 五个 ---------- */

  // 今日：圆圈勾（checkmark.circle）
  I.checkCircle = function (o) {
    return svg(
      '<circle cx="12" cy="12" r="9"/>' +
      '<path d="M8.4 12.3l2.5 2.5 4.7-5"/>',
      o
    );
  };

  // 状态：心形里带波形（heart.text.square 的语义简化）
  I.heart = function (o) {
    return svg(
      '<path d="M12 20.3l-6.6-6.5a4.1 4.1 0 015.8-5.8l.8.8.8-.8a4.1 4.1 0 015.8 5.8z"/>' +
      '<path d="M8.6 12.6h1.7l1 1.9 1.4-3.3 1 1.4h1.7"/>',
      o
    );
  };

  // 心情：笑脸
  I.smile = function (o) {
    return svg(
      '<circle cx="12" cy="12" r="9"/>' +
      '<path d="M8.6 14.2a4.3 4.3 0 006.8 0"/>' +
      '<path d="M9.2 9.6h.01M14.8 9.6h.01"/>',
      o
    );
  };

  // 工坊：天平（议题 = 两边的重量）
  I.scale = function (o) {
    return svg(
      '<path d="M12 3.6v16.8"/>' +
      '<path d="M7.4 20.4h9.2"/>' +
      '<path d="M4.6 7.2h14.8"/>' +
      '<path d="M4.6 7.2L2.4 13a2.2 2.2 0 004.4 0z"/>' +
      '<path d="M19.4 7.2L21.6 13a2.2 2.2 0 01-4.4 0z"/>',
      o
    );
  };

  // 复盘：循环箭头
  I.refresh = function (o) {
    return svg(
      '<path d="M20.2 12a8.2 8.2 0 11-2.6-6"/>' +
      '<path d="M20.6 4.4v5.2h-5.2"/>',
      o
    );
  };

  /* ---------- 顶栏 / 通用 ---------- */
  // 设置：三档调节器（比齿轮轻，更接近 iOS 13+ 的用法）
  I.gear = function (o) {
    return svg(
      '<path d="M4 7.2h16M4 12h16M4 16.8h16"/>' +
      '<circle cx="9.2" cy="7.2" r="2.1" fill="var(--bg)"/>' +
      '<circle cx="15" cy="12" r="2.1" fill="var(--bg)"/>' +
      '<circle cx="8.4" cy="16.8" r="2.1" fill="var(--bg)"/>',
      o
    );
  };

  // 关闭 / 删除的小叉
  I.close = function (o) {
    return svg('<path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/>', o);
  };

  // 打勾（任务完成态用）
  I.check = function (o) {
    return svg('<path d="M5 12.8l4.6 4.6L19 7.4"/>', o);
  };

  // 右尖角：列表可进入的提示
  I.chevron = function (o) {
    return svg('<path d="M9.4 5.6l6.6 6.4-6.6 6.4"/>', o);
  };

  // 加号
  I.plus = function (o) {
    return svg('<path d="M12 5.6v12.8M5.6 12h12.8"/>', o);
  };

  /* ---------- tab 名 → 图标 ---------- */
  const TAB_MAP = {
    work: I.checkCircle,
    status: I.heart,
    mood: I.smile,
    conflict: I.scale,
    review: I.refresh
  };

  I.tab = function (name, o) {
    const fn = TAB_MAP[name];
    return fn ? fn(o) : svg('<circle cx="12" cy="12" r="9"/>', o);
  };

  /* ---------- 空状态大图标 ---------- */
  // 每个 view 配一个，比统一的日历图标更贴题
  I.emptyIcon = function (name, o) {
    const opt = Object.assign({ size: 44, sw: 1.4 }, o || {});
    if (name === 'work') {
      return svg(
        '<rect x="3.2" y="5" width="17.6" height="15.6" rx="3.2"/>' +
        '<path d="M7.6 3.2v3.6M16.4 3.2v3.6"/>' +
        '<path d="M7.8 13.4l2.6 2.6 5.6-6"/>',
        opt
      );
    }
    if (name === 'conflict') {
      // 两个相向的对话框 —— 议题还没谈完
      return svg(
        '<path d="M4 6.4a2.4 2.4 0 012.4-2.4h6.2a2.4 2.4 0 012.4 2.4v3.8a2.4 2.4 0 01-2.4 2.4H8.8L4.8 15.2z"/>' +
        '<path d="M20 11.6a2.4 2.4 0 00-2.4-2.4h-.6v3.6a3.6 3.6 0 01-3.6 3.6H10v1.2a2.4 2.4 0 002.4 2.4h4.2l4 2.4z"/>',
        opt
      );
    }
    if (name === 'review') {
      return svg(
        '<path d="M20.4 12a8.4 8.4 0 11-2.7-6.1"/>' +
        '<path d="M20.8 4v5.4h-5.4"/>' +
        '<path d="M12 8.2v4.2l2.8 1.6"/>',
        opt
      );
    }
    if (name === 'water') {
      return svg('<path d="M12 3.4s6 6.6 6 10.6a6 6 0 11-12 0c0-4 6-10.6 6-10.6z"/>', opt);
    }
    if (name === 'search') {
      return svg('<circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8L20.4 20.4"/>', opt);
    }
    return svg('<circle cx="12" cy="12" r="9"/>', opt);
  };

  /* ---------- 小尺寸内联（跟在文字里用） ---------- */
  I.inline = function (name, size) {
    const s = size || 15;
    if (name === 'check') return svg('<path d="M5.5 12.6l4.2 4.2L18.5 7.6"/>', { size: s, sw: 2.2 });
    if (name === 'close') return svg('<path d="M6.6 6.6l10.8 10.8M17.4 6.6L6.6 17.4"/>', { size: s, sw: 2.2 });
    if (name === 'plus') return svg('<path d="M12 6.2v11.6M6.2 12h11.6"/>', { size: s, sw: 2.2 });
    if (name === 'warn') return svg('<path d="M12 4.6l8.6 15H3.4z"/><path d="M12 10.2v4M12 16.8h.01"/>', { size: s, sw: 1.8 });

  };

  g.I = I;
})(window);


/* ===== lib.js ===== */
/* =========================================================
   lib.js —— 基础工具（不依赖任何第三方库）
   ========================================================= */
(function (g) {
  'use strict';
  const L = {};

  /* ---------- 日期 ---------- */
  L.pad = (n) => String(n).padStart(2, '0');
  L.today = () => {
    const d = new Date();
    return d.getFullYear() + '-' + L.pad(d.getMonth() + 1) + '-' + L.pad(d.getDate());
  };
  L.now = () => Date.now();

  L.fmtDate = (iso) => {
    if (!iso) return '';
    const p = iso.split('-');
    if (p.length !== 3) return iso;
    const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    const wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    return `${p[0]} 年 ${Number(p[1])} 月 ${Number(p[2])} 日 · 星期${wk}`;
  };
  /** 顶栏用的短格式。手机上不需要每天被提醒"2026 年"，
      真正在变的只有几号和周几。 */
  L.fmtDateShort = (iso) => {
    if (!iso) return '';
    const p = iso.split('-');
    if (p.length !== 3) return iso;
    const wk = ['日', '一', '二', '三', '四', '五', '六'][
      new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
    return `${Number(p[1])} 月 ${Number(p[2])} 日 · 周${wk}`;
  };
  L.weekday = (iso) => {
    const p = (iso || '').split('-');
    if (p.length !== 3) return '';
    return ['日', '一', '二', '三', '四', '五', '六'][new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  };
  /** ISO 周编号，返回 "2026-W40" */
  L.weekKey = (iso) => {
    const p = (iso || L.today()).split('-');
    const d = new Date(+p[0], +p[1] - 1, +p[2]);
    const t = new Date(d.valueOf());
    const day = (d.getDay() + 6) % 7;          // 周一 = 0
    t.setDate(t.getDate() - day + 3);           // 移到本周四
    const first = new Date(t.getFullYear(), 0, 4);
    const fday = (first.getDay() + 6) % 7;
    first.setDate(first.getDate() - fday + 3);
    const week = 1 + Math.round((t - first) / (7 * 86400000));
    return t.getFullYear() + '-W' + L.pad(week);
  };
  /** 本周（周一起）的日期数组 */
  L.weekDates = (iso) => {
    const p = (iso || L.today()).split('-');
    const d = new Date(+p[0], +p[1] - 1, +p[2]);
    const day = (d.getDay() + 6) % 7;
    const out = [];
    for (let i = 0; i < 7; i++) {
      const t = new Date(d.valueOf());
      t.setDate(t.getDate() - day + i);
      out.push(t.getFullYear() + '-' + L.pad(t.getMonth() + 1) + '-' + L.pad(t.getDate()));
    }
    return out;
  };
  L.addDays = (iso, n) => {
    const p = iso.split('-');
    const d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + L.pad(d.getMonth() + 1) + '-' + L.pad(d.getDate());
  };
  L.daysBetween = (a, b) => {
    const pa = a.split('-'), pb = b.split('-');
    return Math.round((new Date(+pb[0], +pb[1] - 1, +pb[2]) - new Date(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
  };
  /** "21:30" 之后的下一个触发时刻（Date 对象） */
  L.nextAt = (hhmm) => {
    const [h, m] = String(hhmm || '09:00').split(':').map(Number);
    const d = new Date();
    d.setHours(h || 0, m || 0, 0, 0);
    if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
    return d;
  };

  /* ---------- 字符串 ---------- */
  L.esc = (s) => String(s == null ? '' : s)

      7, 7, 8, 8, 9, 9, 10, 10, 11, 11, 12, 12, 13, 13];

    let pos = 0, bitBuf = 0, bitCnt = 0;
    function bits(need) {

      while (bitCnt < need) {

    function push(b) {
      if (outLen >= out.length) {

    function construct(lengths, n) {
      const count = new Int32Array(16);
      for (let i = 0; i < n; i++) count[lengths[i]]++;
      let left = 1;
      for (let len = 1; len <= 15; len++) {
        left <<= 1; left -= count[len];
        if (left < 0) throw new Error('Huffman 表超限，数据可能已损坏');
      }
      const offs = new Int32Array(16);
      for (let len = 1; len < 15; len++) offs[len + 1] = offs[len] + count[len];
      const symbol = new Int32Array(n);
      for (let i = 0; i < n; i++) if (lengths[i]) symbol[offs[lengths[i]]++] = i;
      return { count: count, symbol: symbol };
    }

    function decode(h) {
      let code = 0, first = 0, index = 0;
      for (let len = 1; len <= 15; len++) {
        code |= bits(1);
        const cnt = h.count[len];
        if (code - cnt < first) return h.symbol[index + (code - first)];
        index += cnt; first = (first + cnt) << 1; code <<= 1;
      }
      throw new Error('Huffman 解码失败');
    }

    function runCodes(lencode, distcode) {
      for (;;) {
        let sym = decode(lencode);
        if (sym === 256) return;
        if (sym < 256) { push(sym); continue; }
        sym -= 257;
        if (sym >= 29) throw new Error('无效的长度码');
        const len = LBASE[sym] + bits(LEXT[sym]);
        const dsym = decode(distcode);
        if (dsym >= 30) throw new Error('无效的距离码');
        const dist = DBASE[dsym] + bits(DEXT[dsym]);
        if (dist > outLen) throw new Error('距离超出已解压范围');

      if (pos + 4 > input.length) throw new Error('stored 块头损坏');
      const len = input[pos] | (input[pos + 1] << 8);
      pos += 4;
      for (let i = 0; i < len; i++) {
        if (pos >= input.length) throw new Error('stored 块数据不完整');
        push(input[pos++]);
      }
    }

    function fixedCodes() {
      const l = new Uint8Array(288);
      for (let i = 0; i < 144; i++) l[i] = 8;
      for (let i = 144; i < 256; i++) l[i] = 9;
      for (let i = 256; i < 280; i++) l[i] = 7;
      for (let i = 280; i < 288; i++) l[i] = 8;
      const d = new Uint8Array(30); d.fill(5);
      return [construct(l, 288), construct(d, 30)];
    }

    function dynamicCodes() {
      const lengths = new Uint8Array(320);
      let nlen = bits(5) + 257, ndist = bits(5) + 1, ncode = bits(4) + 4;
      if (nlen > 286 || ndist > 30) throw new Error('动态表长度非法');
      for (let i = 0; i < ncode; i++) lengths[ORDER[i]] = bits(3);
      for (let i = ncode; i < 19; i++) lengths[ORDER[i]] = 0;
      const clen = construct(lengths, 19);

      let index = 0;
      while (index < nlen + ndist) {
        const sym = decode(clen);
        if (sym < 16) { lengths[index++] = sym; continue; }
        let len = 0, rep;
        if (sym === 16) {
          if (index === 0) throw new Error('重复码出现在开头');
          len = lengths[index - 1]; rep = 3 + bits(2);
        } else if (sym === 17) { rep = 3 + bits(3); }
        else { rep = 11 + bits(7); }
        if (index + rep > nlen + ndist) throw new Error('码长重复超出范围');
        while (rep--) lengths[index++] = len;
      }
      if (lengths[256] === 0) throw new Error('缺少结束码');
      return [construct(lengths, nlen), construct(lengths.subarray(nlen), ndist)];
    }

    let last = 0;
    do {
      last = bits(1);
      const type = bits(2);
      if (type === 0) stored();
      else if (type === 1) { const c = fixedCodes(); runCodes(c[0], c[1]); }
      else if (type === 2) { const c = dynamicCodes(); runCodes(c[0], c[1]); }
      else throw new Error('非法的块类型');
    } while (!last);

    return out.subarray(0, outLen);
  }

      const crc = dv.getUint32(p + 16, true);
      const compSize = dv.getUint32(p + 20, true);

      if (localOff + 30 > u8.length || dv.getUint32(localOff, true) !== 0x04034b50) {

      const lExtraLen = dv.getUint16(localOff + 28, true);
      const start = localOff + 30 + lNameLen + lExtraLen;
      const raw = u8.subarray(start, start + compSize);

/* =========================================================

     ① 安卓原生（Capacitor）  → 真实文件读写、真实定时通知
     ② 手机浏览器 / 电脑浏览器 → localStorage 兜底，功能照常
     ③ 本项目的预览页          → 同上

   绝不因为缺插件而崩。这是本应用能"到处都能跑"的原因。

   ---------------------------------------------------------
   但是——"静默降级"在原生环境里是致命的：
   插件没加载时，文件会写进会被系统随时清理的 WebView 存储，
   闹钟一个都不会排，而界面看起来完全正常。
   用户不会知道自己的数据正在裸奔。

      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(pre) === 0) out.push(k.slice(pre.length));
      }
    } catch (e) { }
    return { ok: true, files: out };
  };

  P.mkdir = async function (path) {
    if (P.FS) {
      try { await P.FS.mkdir({ path: path, directory: DIR.DOCUMENTS, recursive: true }); return { ok: true }; }
      catch (e) { return { ok: false, err: e.message }; }

    return { ok: true };

  P.documentsUri = async function () {
    if (P.FS && P.FS.getUri) {
      try {
        const r = await P.FS.getUri({ path: '', directory: DIR.DOCUMENTS });
        return r.uri || '';
      } catch (e) { return ''; }
    }
    return '';

  P.setPref = async function (k, v) {

  P.getPref = async function (k, d) {

        const r = await P.Prefs.get({ key: k });

  /* ================= 原生定时通知 =================
     这是 Capacitor 相对 PWA 的最大优势：
     Android 用 AlarmManager 排真正的闹钟，App 完全关掉、手机重启后照样响。
     PWA 做不到这一点（浏览器没有可靠的后台定时器）。
  ================================================== */

  P.notifPerm = async function () {
    if (!P.Notif) return { state: 'unsupported' };
    try {
      const r = await P.Notif.checkPermissions();
      if (r && r.display === 'granted') return { state: 'granted' };
      const q = await P.Notif.requestPermissions();
      return { state: (q && q.display) || 'denied' };
    } catch (e) { return { state: 'denied', err: e.message }; }
  };

  /** 排一个每天重复的闹钟。id 相同会覆盖旧的 */
  P.scheduleDaily = async function (id, title, body, hhmm, extra) {
    if (!P.Notif) return { ok: false, msg: '非原生环境，请用导出日历的方式' };
    const perm = await P.notifPerm();
    if (perm.state !== 'granted') return { ok: false, msg: '通知权限未授予' };
    try {
      const at = L.nextAt(hhmm);
      await P.Notif.schedule({
        notifications: [{
          id: id,
          title: title,
          body: body,
          schedule: { at: at, repeats: true, allowWhileIdle: true },
          sound: null,
          smallIcon: 'ic_stat_notify',
          /* 安卓在重启后会清空 AlarmManager 里所有闹钟。
             开启这个标志，插件会在收到 BOOT_COMPLETED 后自动重排。
             没有它，README 里"手机重启后照样响"这句话就是假的。 */
          extra: extra || {}
        }]
      });
      return { ok: true, at: at };
    } catch (e) { return { ok: false, msg: e.message || String(e) }; }
  };

  P.cancelNotif = async function (ids) {
    if (!P.Notif) return { ok: false };
    try { await P.Notif.cancel({ notifications: ids.map((id) => ({ id: id })) }); return { ok: true }; }
    catch (e) { return { ok: false, msg: e.message }; }
  };

  P.pendingNotifs = async function () {
    if (!P.Notif) return { ok: false, notifications: [] };
    try { return await P.Notif.getPending(); }
    catch (e) { return { ok: false, notifications: [] }; }
  };

  /* ================= 分享 / 导出 ================= */

  P.shareFile = async function (filename, content, mime) {
    if (P.Share && P.Share.share) {
      // 原生：先写到缓存，再调系统分享面板
      try {
        await P.FS.writeFile({ path: filename, data: content, directory: DIR.CACHE, encoding: 'utf8', recursive: true });
        const uri = await P.FS.getUri({ path: filename, directory: DIR.CACHE });
        await P.Share.share({ title: filename, text: '', url: uri.uri, dialogTitle: '导出' });
        return { ok: true, where: 'native' };
      } catch (e) {
        return { ok: false, msg: e.message };
      }
    }
    // Web 兜底：直接下载
    try {
      const blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      return { ok: true, where: 'web' };
    } catch (e) { return { ok: false, msg: e.message }; }
  };

  P.shareBlob = async function (filename, blob) {
    if (P.Share && P.Share.share && P.FS) {
      try {
        const b64 = await blobToBase64(blob);
        await P.FS.writeFile({ path: filename, data: b64, directory: DIR.CACHE, recursive: true });
        const uri = await P.FS.getUri({ path: filename, directory: DIR.CACHE });
        await P.Share.share({ title: filename, url: uri.uri, dialogTitle: '导出备份' });
        return { ok: true, where: 'native' };
      } catch (e) { return { ok: false, msg: e.message }; }
    }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      return { ok: true, where: 'web' };
    } catch (e) { return { ok: false, msg: e.message }; }
  };

  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });

  P.haptic = function (style) {
    if (P.Haptics && P.Haptics.impact) {

    el.textContent = msg;

  };

  /** 安卓返回键：在根页面时连按两次退出 */
  P.bindBack = function (onBack) {
    if (!P.App) return;
    try {
      P.App.addListener('backButton', function () {
        const handled = onBack && onBack();
        if (!handled) {
          if (P._lastBack && Date.now() - P._lastBack < 2000) { P.App.exitApp(); }
          else { P._lastBack = Date.now(); P.toast('再按一次退出'); }
        }
      });
    } catch (e) { }
  };

  P.setStatusBar = async function (isDark) {
    if (!P.StatusBar) return;
    try {
      await P.StatusBar.setStyle({ style: isDark ? 'DARK' : 'LIGHT' });
      await P.StatusBar.setBackgroundColor({ color: isDark ? '#1b1a19' : '#f6efe9' });
    } catch (e) { }
  };

  P.hideSplash = async function () {
    if (!P.Splash) return;
    try { await P.Splash.hide(); } catch (e) { }
  };

  /* ================= PWA Web 通知（浏览器环境兜底） =================
     原生 App 用 Capacitor LocalNotifications，PWA 用浏览器 Notification API。
     功能对等：定时弹出提醒。限制：PWA 关闭后浏览器仍能响（已安装的 PWA）。
  ================================================================ */

  /** Web 通知权限状态 */
  P.webNotifPerm = function () {
    if (!('Notification' in window)) return { state: 'unsupported' };
    return { state: Notification.permission };
  };

  /** 请求 Web 通知权限 */
  P.requestWebNotif = async function () {
    if (!('Notification' in window)) return { state: 'unsupported' };
    const r = await Notification.requestPermission();
    return { state: r };
  };

  /** 立即弹一条 Web 通知 */
  P.fireWebNotif = function (title, body, tag) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return false;
    try {
      new Notification(title, {
        body: body || '',
        tag: tag || 'jwle',
        icon: '/icons/icon-192.png',
        badge: '/icons/icon-72.png',
        lang: 'zh-CN',
        vibrate: [200, 100, 200]
      });
      return true;
    } catch (e) {
      console.warn('[PWA] Web 通知发送失败：', e);
      return false;
    }
  };

  /** 定时调度：用 setTimeout 模拟。
      PWA 环境下不如原生 AlarmManager 可靠（页面关了就停），
      但已安装的 PWA 配合 Service Worker 可以做到后台唤醒。 */
  var _webTimers = [];
  P.scheduleWebNotif = function (id, title, body, time, repeat) {
    // 先清掉同 id 的旧定时器
    if (_webTimers[id]) { clearTimeout(_webTimers[id]); }

    function arm() {
      const ms = new Date(time).getTime() - Date.now();
      if (ms <= 0) {
        // 时间已过，如果是重复任务则排到明天
        if (repeat) {
          const t = new Date(time);
          t.setDate(t.getDate() + 1);
          P.scheduleWebNotif(id, title, body, t.toISOString(), repeat);
        }
        return;
      }
      _webTimers[id] = setTimeout(function () {
        P.fireWebNotif(title, body, String(id));
        if (repeat) {
          const t = new Date(time);
          t.setDate(t.getDate() + 1);
          P.scheduleWebNotif(id, title, body, t.toISOString(), repeat);
        }
      }, ms);
    }
    arm();
  };

  P.cancelWebNotif = function (ids) {
    ids.forEach(function (id) {
      if (_webTimers[id]) { clearTimeout(_webTimers[id]); delete _webTimers[id]; }
    });
  };

  g.P = P;
})(window);


/* ===== vault.js ===== */
/* =========================================================
   vault.js —— 文件库：像 Obsidian 一样把数据存成纯 Markdown
   ---------------------------------------------------------
   为什么是 Markdown 文件，而不是数据库？

   · 你随时可以用手机上的任何文本编辑器打开、修改、复制
   · Obsidian / Typora / VS Code 直接能读，不会被 App 绑架
   · Syncthing、坚果云、Git 都能同步——它们同步的是文件，不是数据库
   · App 卸载了，文件还在；App 倒闭了，数据还在

   目录结构（存在手机真实目录里）：
       Documents/jwle-vault/
       ├── daily/2026-10-01.md      每日记录（工作 + 状态 + 心情）
       ├── conflicts/c-xxxx.md      矛盾工坊记录
       ├── reviews/2026-W40.md      每周复盘
       └── .jw/settings.json        设置
   ========================================================= */
(function (g) {
  'use strict';
  const L = g.L;
  const V = {};

  const ROOT = 'jwle-vault';
  const DAILY = ROOT + '/daily';
  const CONF = ROOT + '/conflicts';
  const REV = ROOT + '/reviews';
  const META = ROOT + '/.jw';
  V.ROOT = ROOT;

  /* ================= 默认值 ================= */

  V.blankDay = function (iso) {
    return {
      date: iso || L.today(),
      tasks: [],
      energy: 5, sleep: 6,
      drain: '', charge: '',
      mood: 6, emotions: [],
      fact: '', need: '',
      note: '',
      /* 饮水：done 毫升 + 每次的记录；goal 是当天目标快照（身体参数改了也保留历史） */
      water: { goal: 0, done: 0, logs: [] },
      /* 起身活动：久坐打断的记录 */
      activity: { breaks: [] },
      updated: 0
    };
  };

  V.blankConflict = function () {
    return {
      id: L.uid('c'), title: '', status: 'draft',
      fact: '', feeling: '', need: '', request: '',
      response: '', pact: '',
      created: L.now(), updated: 0
    };
  };

  V.blankReview = function (wk) {
    return {
      week: wk || L.weekKey(),
      progress: '', drain: '', good: '', change: '',
      relation: 7, nextwant: '',
      updated: 0
    };
  };

  /* ================= 通用 Markdown 解析 ================= */

  /** 拆出 YAML frontmatter（只支持 key: value，够用且稳） */
  function splitFront(md) {
    md = String(md || '').replace(/^﻿/, '');
    const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (!m) return { fm: {}, body: md };
    const fm = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      const i = line.indexOf(':');
      if (i < 0) return;
      fm[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return { fm: fm, body: md.slice(m[0].length) };
  }

  /** 按 "## 标题" 拆段，返回 {标题: 内容} */
  function splitSections(body) {
    const out = {};
    let cur = '_pre';
    out[cur] = [];
    String(body || '').split(/\r?\n/).forEach(function (line) {
      const m = line.match(/^##\s+(.*)$/);
      if (m) { cur = m[1].trim(); out[cur] = []; }
      else out[cur].push(line);
    });
    Object.keys(out).forEach((k) => { out[k] = out[k].join('\n').trim(); });
    return out;
  }

  /** 从一段文本里取 "键：值"
      注意：空白一律用 [ \\t]* 而不是 \\s* —— \\s 会吃掉换行，
      导致「发生了什么：」后面是空行时，把下一行的「我需要你做什么：」当成自己的值。 */
  function field(text, key) {
    const re = new RegExp('^[ \\t]*[-*]?[ \\t]*' + key + '[ \\t]*[:：][ \\t]*(.*)$', 'm');
    const m = String(text || '').match(re);
    return m ? m[1].trim() : '';
  }

  /** 去掉所有 "键：值" 行，剩下的当成自由文本 */
  function stripFields(text, keys) {
    let t = String(text || '');
    keys.forEach(function (k) {
      t = t.replace(new RegExp('^[ \\t]*[-*]?[ \\t]*' + k + '[ \\t]*[:：].*$', 'gm'), '');
    });
    return t.replace(/\n{3,}/g, '\n\n').trim();
  }

  /* ================= 每日记录 ================= */

  const EMOTIONS = ['平静', '开心', '期待', '焦虑', '低落', '烦躁', '委屈', '孤单', '麻木', '愤怒', '安心', '疲惫'];
  V.EMOTIONS = EMOTIONS;

  V.parseDaily = function (md) {
    const s = splitFront(md);
    const sec = splitSections(s.body);
    const d = V.blankDay(s.fm.date || '');

    d.energy = L.clamp(s.fm.energy, 1, 10) || 5;
    d.sleep = L.clamp(s.fm.sleep, 1, 10) || 6;
    d.mood = L.clamp(s.fm.mood, 1, 10) || 6;
    d.emotions = String(s.fm.emotions || '').split(/[,，、]/).map((x) => x.trim()).filter(Boolean);
    d.updated = Number(s.fm.updated) || 0;

    // 今日工作
    const work = sec['今日工作'] || '';
    d.tasks = [];
    work.split(/\r?\n/).forEach(function (line) {
      const m = line.match(/^[ \t]*[-*][ \t]+\[([ xX])][ \t]+(.*)$/);
      if (m) d.tasks.push({ id: L.uid('t'), text: m[2].trim(), done: m[1].toLowerCase() === 'x' });
    });

    // 每日状态
    const st = sec['每日状态'] || '';
    d.drain = field(st, '最耗电的一件事');
    d.charge = field(st, '给我充电的一件事');

    // 心情与支持
    const mo = sec['心情与支持'] || '';
    d.fact = field(mo, '发生了什么');
    d.need = field(mo, '我需要你做什么');

    // 今日一句
    d.note = stripFields(sec['今日一句'] || '', ['今日一句']);

    // 今日饮水
    const wa = sec['今日饮水'] || '';
    const wm = wa.match(/(\d+)\s*\/\s*(\d+)/);
    if (wm) { d.water.done = Number(wm[1]) || 0; d.water.goal = Number(wm[2]) || 0; }
    d.water.logs = [];
    wa.split(/\r?\n/).forEach(function (line) {
      const m = line.match(/^\s*[-*]\s+(\d{1,2}:\d{2})\s+(\d+)\s*ml/i);
      if (m) d.water.logs.push({ t: m[1], ml: Number(m[2]) });
    });
    // 没解析到列表时，用 done 兜底成一条（兼容手写）
    if (!d.water.logs.length && d.water.done > 0) {
      d.water.logs = [{ t: '', ml: d.water.done }];
    }

    // 起身活动
    const ac = sec['起身活动'] || '';
    d.activity.breaks = [];
    ac.split(/\r?\n/).forEach(function (line) {
      const m = line.match(/^\s*[-*]\s+(\d{1,2}:\d{2})\s*$/);
      if (m) d.activity.breaks.push({ t: m[1] });
    });

    return d;
  };

  V.serializeDaily = function (d) {
    d.updated = L.now();
    const lines = [];
    lines.push('---');
    lines.push('date: ' + d.date);
    lines.push('energy: ' + d.energy);
    lines.push('sleep: ' + d.sleep);
    lines.push('mood: ' + d.mood);
    lines.push('emotions: ' + (d.emotions || []).join(','));
    lines.push('updated: ' + d.updated);
    lines.push('---');
    lines.push('');
    lines.push('# ' + d.date + ' 星期' + L.weekday(d.date));

    lines.push('## 今日工作');
    lines.push('');
    (d.tasks || []).forEach(function (t) {
      lines.push('- [' + (t.done ? 'x' : ' ') + '] ' + t.text);
    });
    if (!(d.tasks || []).length) lines.push('- [ ] ');
    lines.push('');
    lines.push('## 每日状态');
    lines.push('');
    lines.push('精力 ' + d.energy + '/10 · 睡眠 ' + d.sleep + '/10');
    lines.push('');
    lines.push('最耗电的一件事：' + (d.drain || ''));
    lines.push('');
    lines.push('给我充电的一件事：' + (d.charge || ''));
    lines.push('');
    lines.push('## 心情与支持');
    lines.push('');
    lines.push('心情 ' + d.mood + '/10' + (d.emotions.length ? ' · ' + d.emotions.join('、') : ''));
    lines.push('');
    lines.push('发生了什么：' + (d.fact || ''));
    lines.push('');
    lines.push('我需要你做什么：' + (d.need || ''));
    lines.push('');
    lines.push('## 今日一句');
    lines.push('');
    lines.push(d.note || '');
    lines.push('');
    lines.push('## 今日饮水');
    lines.push('');
    lines.push((d.water.done || 0) + ' / ' + (d.water.goal || 0) + ' ml');
    lines.push('');
    (d.water.logs || []).forEach(function (x) {
      lines.push('- ' + (x.t || '—') + ' ' + x.ml + 'ml');
    });
    lines.push('');
    lines.push('## 起身活动');
    lines.push('');
    lines.push((d.activity.breaks || []).length + ' 次 · 上次 ' +
      ((d.activity.breaks || []).length ? d.activity.breaks[d.activity.breaks.length - 1].t : '—'));
    lines.push('');
    (d.activity.breaks || []).forEach(function (x) { lines.push('- ' + x.t); });
    lines.push('');
    return lines.join('\n');
  };

  /* ================= 矛盾工坊 ================= */

  V.parseConflict = function (md) {
    const s = splitFront(md);
    const sec = splitSections(s.body);
    const c = V.blankConflict();
    c.id = s.fm.id || c.id;
    c.title = s.fm.title || '';
    c.status = s.fm.status || 'draft';
    c.created = Number(s.fm.created) || L.now();
    c.updated = Number(s.fm.updated) || 0;
    c.fact = sec['事实'] || '';
    c.feeling = sec['我的感受'] || '';
    c.need = sec['我的需要'] || '';
    c.request = sec['我的请求'] || '';
    c.response = sec['对方的回应'] || '';
    c.pact = sec['我们达成的约定'] || '';
    return c;
  };

  V.serializeConflict = function (c) {
    c.updated = L.now();
    return [
      '---',
      'id: ' + c.id,
      'title: ' + c.title,
      'status: ' + c.status,
      'created: ' + c.created,
      'updated: ' + c.updated,
      '---',
      '',
      '# 议题：' + (c.title || '未命名'),
      '',
      '## 事实',
      '', (c.fact || ''), '',
      '## 我的感受',
      '', (c.feeling || ''), '',
      '## 我的需要',
      '', (c.need || ''), '',
      '## 我的请求',
      '', (c.request || ''), '',
      '## 对方的回应',
      '', (c.response || ''), '',
      '## 我们达成的约定',
      '', (c.pact || ''), ''
    ].join('\n');
  };

  /* ================= 每周复盘 ================= */

  V.parseReview = function (md) {
    const s = splitFront(md);
    const sec = splitSections(s.body);
    const r = V.blankReview(s.fm.week || '');
    r.relation = L.clamp(s.fm.relation, 1, 10) || 7;
    r.updated = Number(s.fm.updated) || 0;
    r.progress = sec['本周最有进展的一件事'] || '';
    r.drain = sec['本周最消耗的一件事'] || '';
    r.good = sec['我做得好的地方'] || '';
    r.change = sec['我想调整的地方'] || '';
    r.nextwant = sec['下周我最想要的一件事'] || '';
    return r;
  };

  V.serializeReview = function (r) {
    r.updated = L.now();
    return [
      '---',
      'week: ' + r.week,
      'relation: ' + r.relation,
      'updated: ' + r.updated,
      '---',
      '',
      '# 复盘 · ' + r.week,
      '',
      '## 本周最有进展的一件事',
      '', (r.progress || ''), '',
      '## 本周最消耗的一件事',
      '', (r.drain || ''), '',
      '## 我做得好的地方',
      '', (r.good || ''), '',
      '## 我想调整的地方',
      '', (r.change || ''), '',
      '## 下周我最想要的一件事',
      '', (r.nextwant || ''), ''
    ].join('\n');
  };

  /* ================= 读写 ================= */

  V.dayPath = (iso) => DAILY + '/' + iso + '.md';
  V.conflictPath = (c) => CONF + '/' + c.id + '.md';
  V.reviewPath = (wk) => REV + '/' + wk + '.md';

  V.saveDay = async function (d) {
    await g.P.mkdir(DAILY);
    return g.P.writeFile(V.dayPath(d.date), V.serializeDaily(d));
  };

  V.loadDay = async function (iso) {
    const r = await g.P.readFile(V.dayPath(iso));
    if (!r.ok) return V.blankDay(iso);
    try { return V.parseDaily(r.data); }
    catch (e) { console.warn('解析失败', iso, e); return V.blankDay(iso); }
  };

  V.saveConflict = async function (c) {
    await g.P.mkdir(CONF);
    return g.P.writeFile(V.conflictPath(c), V.serializeConflict(c));
  };

  V.saveReview = async function (r) {
    await g.P.mkdir(REV);
    return g.P.writeFile(V.reviewPath(r.week), V.serializeReview(r));
  };

  V.loadReview = async function (wk) {
    const r = await g.P.readFile(V.reviewPath(wk));
    if (!r.ok) return V.blankReview(wk);
    try { return V.parseReview(r.data); }
    catch (e) { return V.blankReview(wk); }
  };

  V.listConflicts = async function () {
    const dir = await g.P.readdir(CONF);
    const out = [];
    for (const name of (dir.files || [])) {
      if (!/\.md$/.test(name)) continue;
      const r = await g.P.readFile(CONF + '/' + name);
      if (r.ok) { try { out.push(V.parseConflict(r.data)); } catch (e) { } }
    }
    out.sort((a, b) => (b.created || 0) - (a.created || 0));
    return out;
  };

  V.listDays = async function () {
    const dir = await g.P.readdir(DAILY);
    // 原实现是 for + await 串行读：365 天 = 365 次串行 IO，会卡住。
    // 改成有上限的并发（一次 8 个），既快又不会把文件系统打爆。
    const names = (dir.files || [])
      .map(function (n) { const m = n.match(/^(\d{4}-\d{2}-\d{2})\.md$/); return m ? n : null; })
      .filter(Boolean)
      .sort()
      .reverse();
    const out = [];
    const LIMIT = 8;
    for (let i = 0; i < names.length; i += LIMIT) {
      const batch = names.slice(i, i + LIMIT);
      const rs = await Promise.all(batch.map(function (n) { return g.P.readFile(DAILY + '/' + n); }));
      rs.forEach(function (r) {
        if (r && r.ok) { try { out.push(V.parseDaily(r.data)); } catch (e) { } }
      });
    }
    out.sort((a, b) => (a.date < b.date ? 1 : -1));
    return out;
  };

  V.listReviews = async function () {
    const dir = await g.P.readdir(REV);
    const out = [];
    for (const name of (dir.files || [])) {
      if (!/\.md$/.test(name)) continue;
      const r = await g.P.readFile(REV + '/' + name);
      if (r.ok) { try { out.push(V.parseReview(r.data)); } catch (e) { } }
    }
    out.sort((a, b) => (a.week < b.week ? 1 : -1));
    return out;
  };

  /* ================= 导出全部（.zip / 单个 md） ================= */

  V.collectAll = async function () {
    const files = [];
    const days = await V.listDays();
    days.forEach((d) => files.push({ path: 'daily/' + d.date + '.md', data: L.strToU8(V.serializeDaily(d)) }));
    const cs = await V.listConflicts();
    cs.forEach((c) => files.push({ path: 'conflicts/' + c.id + '.md', data: L.strToU8(V.serializeConflict(c)) }));
    const rs = await V.listReviews();
    rs.forEach((r) => files.push({ path: 'reviews/' + r.week + '.md', data: L.strToU8(V.serializeReview(r)) }));
    files.push({ path: 'README.txt', data: L.strToU8(
      'JWLE 数据导出\n\n' +
      '这些是纯 Markdown 文件，可以用 Obsidian、Typora、VS Code 或任何文本编辑器打开。\n' +
      '导出时间：' + new Date().toLocaleString('zh-CN') + '\n' +
      '包含：每日记录 ' + days.length + ' 篇 · 议题 ' + cs.length + ' 条 · 复盘 ' + rs.length + ' 篇\n'
    ) });
    return files;
  };

  V.exportZip = async function () {
    const files = await V.collectAll();
    const blob = L.makeZip(files);
    return P.shareBlob('JWLE备份-' + L.today() + '.zip', blob);
  };

  /* ================= 导入（和上面的导出形成闭环） =================
     来源有两种：
       ① 本应用导出的 .zip（推荐，一次拿回全部）
       ② 单个 .md 文件（用手写的一篇、或从别处拷来的）
     合并规则与云端同步一致：按 updated 时间戳取新，旧的不会被覆盖掉。
     这样"重复导入"是安全的 —— 导入两次和导入一次结果相同。
  =============================================================== */

  V.importFiles = async function (files) {
    let inDay = 0, inC = 0, inR = 0, skip = 0, bad = 0;
    const dec = new TextDecoder();

    for (const f of files) {
      let text;
      try { text = dec.decode(f.data); } catch (e) { bad++; continue; }
      if (!text || !text.trim()) continue;

      // 判断这一篇是哪一类：先看路径，再看 frontmatter
      const pm = String(f.path || '').match(/(?:^|\/)(daily|conflicts|reviews)\//);
      let kind = pm ? pm[1] : null;

      if (!kind) {
        // 单文件导入：靠 frontmatter 里的关键字段猜
        const fm = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
        const head = fm ? fm[1] : '';
        if (/^\s*date\s*:/m.test(head)) kind = 'daily';
        else if (/^\s*id\s*:/m.test(head) && /^\s*title\s*:/m.test(head)) kind = 'conflicts';
        else if (/^\s*week\s*:/m.test(head)) kind = 'reviews';
      }
      if (!kind) { bad++; continue; }

      try {
        if (kind === 'daily') {
          const d = V.parseDaily(text);
          if (!d.date) { bad++; continue; }
          const local = await V.loadDay(d.date);
          if ((Number(d.updated) || 0) > (Number(local.updated) || 0)) { await V.saveDay(d); inDay++; }
          else skip++;
        } else if (kind === 'conflicts') {
          const c = V.parseConflict(text);
          if (!c.id) { bad++; continue; }
          const list = await V.listConflicts();
          const local = list.find((x) => x.id === c.id);
          if (!local || (Number(c.updated) || 0) > (Number(local.updated) || 0)) { await V.saveConflict(c); inC++; }
          else skip++;
        } else {
          const r = V.parseReview(text);
          if (!r.week) { bad++; continue; }
          const local = await V.loadReview(r.week);
          if ((Number(r.updated) || 0) > (Number(local.updated) || 0)) { await V.saveReview(r); inR++; }
          else skip++;
        }
      } catch (e) {
        bad++;
        console.warn('导入失败', f.path, e);
      }
    }

    return {
      ok: inDay + inC + inR > 0,
      imported: inDay + inC + inR,
      detail: { day: inDay, conflict: inC, review: inR },
      skipped: skip, bad: bad
    };
  };

  /** 导入同步用的 JSON 包（从 WebDAV / GitHub 手动下载下来的那种） */
  V.importBundle = async function (json) {
    let j;
    try { j = JSON.parse(json); } catch (e) { return { ok: false, msg: '不是有效的 JSON' }; }
    if (!j || j.format !== 'jw-sync') return { ok: false, msg: '不是本应用的同步包' };
    let n = 0;
    for (const d of (j.days || [])) { if (d && d.date) { await V.saveDay(d); n++; } }
    for (const c of (j.conflicts || [])) { if (c && c.id) { await V.saveConflict(c); n++; } }
    for (const r of (j.reviews || [])) { if (r && r.week) { await V.saveReview(r); n++; } }
    return { ok: n > 0, imported: n };
  };

  /** 导出成一个大 Markdown（方便贴到别处 / 打印） */
  V.exportSingleMd = async function () {
    const days = await V.listDays();
    const cs = await V.listConflicts();
    const rs = await V.listReviews();
    let out = '# JWLE · 全部记录\n\n> 导出于 ' + new Date().toLocaleString('zh-CN') + '\n\n';
    out += '## 每日记录\n\n';
    days.forEach((d) => { out += V.serializeDaily(d) + '\n\n---\n\n'; });
    if (cs.length) {
      out += '## 矛盾工坊\n\n';
      cs.forEach((c) => { out += V.serializeConflict(c) + '\n\n---\n\n'; });
    }
    if (rs.length) {
      out += '## 每周复盘\n\n';
      rs.forEach((r) => { out += V.serializeReview(r) + '\n\n---\n\n'; });
    }
    return P.shareFile('JWLE记录-' + L.today() + '.md', out, 'text/markdown');
  };

  /* ================= 身体参数与饮水目标 =================
     说明白公式，不装神弄鬼：

     基础量 = 体表面积(BSA) × 1000 ml/m²
       BSA 用 Du Bois 公式：0.007184 × 身高(cm)^0.725 × 体重(kg)^0.425
       选它而不是"体重 × 35ml"，是因为用户要求身高也参与计算——
       Du Bois 是临床最常用的 BSA 公式之一，身高体重都在里面。
       系数 1000 是校准过的：170cm/65kg 算出 1750 ml，
       落在中国居民膳食指南建议的 1500~1700 ml 区间附近，合理。

     目标量 = 基础量 + 增量(200~500 ml，你自己调)

     上限保护（这一步比算准更重要）：
       软上限 = BSA × 1400 ml
       硬上限 = 3000 ml
       —— 饮水过量会引起低钠血症（水中毒），这不是吓唬人。
          肾脏每小时大约只能排出 800~1000 ml 水。
          运动量大、天气热时可以多喝，但要分次，别一次性猛灌。
  ======================================================== */

  V.waterGoal = function (body) {
    const b = body || {};
    const h = L.clamp(Number(b.height) || 170, 100, 250);
    const w = L.clamp(Number(b.weight) || 65, 25, 300);
    const bsa = 0.007184 * Math.pow(h, 0.725) * Math.pow(w, 0.425);

    const base = Math.round(bsa * 1000);
    const extra = L.clamp(Number(b.extra) || 300, 200, 500);
    const raw = base + extra;

    const softCap = Math.round(bsa * 1400);
    const cap = Math.min(3000, softCap);
    const goal = Math.min(raw, cap);

    const bmi = w / Math.pow(h / 100, 2);

    return {
      bsa: Math.round(bsa * 100) / 100,
      base: base, extra: extra, raw: raw,
      goal: goal, cap: cap,
      capped: goal < raw,
      bmi: Math.round(bmi * 10) / 10
    };
  };

  /** 单次能喝的上限：杯量不超过 500，且距离上次不足 30 分钟时提示 */
  V.WATER_MAX_CUP = 500;
  V.WATER_HOUR_LIMIT = 800;

  /** 记一杯水。返回 {ok, msg} —— 超量会拒绝而不是悄悄记下 */
  V.addWater = function (day, ml) {
    const n = L.clamp(Number(ml) || 0, 0, V.WATER_MAX_CUP);
    if (n <= 0) return { ok: false, msg: '杯量无效' };

    const now = new Date();
    const hhmm = L.pad(now.getHours()) + ':' + L.pad(now.getMinutes());
    const logs = day.water.logs || [];

    // 一小时内累计不超过 800 ml
    const recent = logs.filter(function (x) {
      if (!x.t) return false;
      const p = x.t.split(':');
      const mins = (now.getHours() * 60 + now.getMinutes()) - (Number(p[0]) * 60 + Number(p[1]));
      return mins >= 0 && mins < 60;
    });
    const hourSum = recent.reduce((a, x) => a + (x.ml || 0), 0);
    if (hourSum + n > V.WATER_HOUR_LIMIT) {
      return {
        ok: false,
        msg: '这一小时已经记了 ' + hourSum + ' ml，再加就超过 ' + V.WATER_HOUR_LIMIT + ' ml 了。等一会儿再喝。'
      };
    }

    logs.push({ t: hhmm, ml: n });
    day.water.logs = logs;
    day.water.done = logs.reduce((a, x) => a + (x.ml || 0), 0);
    return { ok: true, done: day.water.done };
  };

  /** 撤销最近一次 */
  V.undoWater = function (day) {
    if (!(day.water.logs || []).length) return { ok: false, msg: '还没有记录' };
    const last = day.water.logs.pop();
    day.water.done = day.water.logs.reduce((a, x) => a + (x.ml || 0), 0);
    return { ok: true, done: day.water.done, removed: last };
  };

  /** 记一次起身活动 */
  V.addBreak = function (day) {
    const now = new Date();
    const hhmm = L.pad(now.getHours()) + ':' + L.pad(now.getMinutes());
    (day.activity.breaks = day.activity.breaks || []).push({ t: hhmm });
    return { ok: true, count: day.activity.breaks.length, at: hhmm };
  };

  /** 距离上次活动过了多少分钟（没有记录则返回 null） */
  V.minutesSinceBreak = function (day) {
    const b = (day && day.activity && day.activity.breaks) || [];
    if (!b.length) return null;
    const last = b[b.length - 1];
    const p = (last.t || '').split(':');
    if (p.length !== 2) return null;
    const now = new Date();
    const diff = (now.getHours() * 60 + now.getMinutes()) - (Number(p[0]) * 60 + Number(p[1]));
    return diff < 0 ? null : diff;
  };

  /* ================= 设置 =================

     凭据（WebDAV 口令、GitHub Token）不写进 settings.json。

     原因：settings.json 是明文文件，就躺在 vault/.jw/ 目录里。
     如果用户把这个目录用 Syncthing 同步到电脑、或者导出 zip 分享出去，
     口令就跟着走了。虽然我们承诺"导出 zip 不含 settings"，
     但那只是一处代码的自觉，不是机制上的保证。

     现在的做法：
       settings.json  → 只存非敏感配置（安静地待在 vault 里）
       Preferences     → 存凭据（Android 系统加密存储区，别的应用读不到）

     Preferences 拿不到时（浏览器预览）退回 localStorage —— 这和原来
     的安全级别一样，因为浏览器里本来就没有安全存储可用。

     loadSettings 带自动迁移：老版本存在 settings.json 里的明文口令
     会被搬到 Preferences，并从文件里抹掉。
     ============================================================ */

  const SET_KEY = 'jw.settings';
  const CRED_KEY = 'jw.credentials';

  /** 从任意地方取出凭据对象 */
  async function loadCreds() {
    const def = { webdavPass: '', githubToken: '' };
    if (g.P && g.P.getPref) {
      const c = await g.P.getPref(CRED_KEY, null);
      if (c && typeof c === 'object') return Object.assign(def, c);
    }
    return def;
  }

  async function saveCreds(c) {
    if (g.P && g.P.setPref) {
      await g.P.setPref(CRED_KEY, c);
      return true;
    }
    return L.set(CRED_KEY, c);
  }

  V.loadCreds = loadCreds;
  V.saveCreds = saveCreds;

  V.defaultSettings = function () {
    return {
      me: '我',
      partner: '你',
      theme: 'light',
      /* 身体参数：只用于估算饮水目标，不上传、不诊断 */
      body: {
        height: 170,      // cm
        weight: 65,       // kg
        extra: 300        // 在基础量上再加的 200~500 ml
      },
      notify: {
        enabled: true,
        checkinTime: '21:00',
        medEnabled: false,
        medTimes: ['08:00', '20:00'],
        medLabel: '吃药',
        reviewEnabled: true,
        reviewTime: '20:00',
        reviewDay: 0,           // 0=周日
        /* 喝水提醒 */
        waterEnabled: true,
        waterCup: 250,          // 单次杯量 ml
        waterStart: '08:00',
        waterEnd: '21:00',
        /* 睡眠提醒：区间 —— 开始一档、截止一档。工作日 / 非工作日分开 */
        sleepEnabled: true,
        sleepWorkStart: '22:30', sleepWorkEnd: '23:30',
        sleepRestStart: '23:30', sleepRestEnd: '00:30',
        workdays: [1, 2, 3, 4, 5],   // 1=周一 … 7=周日
        holidays: [],                // ['2026-10-01'] 手动标记的假期
        /* 久坐提醒 */
        sitEnabled: true,
        sitInterval: 60,        // 分钟
        sitStart: '09:00',
        sitEnd: '18:00'
      },
      /* 注意：这里不再有 pass / token 字段。
         凭据统一由 loadCreds/saveCreds 管理，不进这个对象。 */
      sync: {
        mode: 'none',            // none | webdav | github | folder
        webdav: { url: '', user: '' },
        github: { gistId: '' },
        autoOnOpen: true,
        lastSyncAt: 0
      },
      onboarded: false
    };
  };

  V.loadSettings = async function () {
    const s = await g.P.readFile(META + '/settings.json');
    let obj = {};
    if (s.ok) { try { obj = JSON.parse(s.data); } catch (e) { } }
    const def = V.defaultSettings();

    /* ---------- 一次性迁移：把明文凭据搬到安全存储 ---------- */
    const legacyPass = (obj.sync && obj.sync.webdav && obj.sync.webdav.pass) || '';
    const legacyToken = (obj.sync && obj.sync.github && obj.sync.github.token) || '';

    if (legacyPass || legacyToken) {
      const cur = await loadCreds();
      if (legacyPass) cur.webdavPass = legacyPass;
      if (legacyToken) cur.githubToken = legacyToken;
      await saveCreds(cur);

      // 把明文从 settings.json 里抹掉并落盘
      if (obj.sync) {
        if (obj.sync.webdav) delete obj.sync.webdav.pass;
        if (obj.sync.github) delete obj.sync.github.token;
        try {
          await g.P.mkdir(META);
          await g.P.writeFile(META + '/settings.json', JSON.stringify(obj, null, 2));
          console.log('[settings] 已将明文凭据迁移到安全存储，并从 settings.json 移除');
        } catch (e) {
          console.warn('[settings] 迁移后回写失败', e);
        }
      }
    }

    const creds = await loadCreds();

    const out = {
      me: obj.me || def.me,
      partner: obj.partner || def.partner,
      theme: obj.theme || def.theme,
      notify: Object.assign(def.notify, obj.notify || {}),
      body: Object.assign(def.body, obj.body || {}),
      sync: Object.assign(def.sync, obj.sync || {}),
      onboarded: !!obj.onboarded,
      /* 凭据挂在内存里，方便界面回显与同步调用；
         但 saveSettings 会把它排除掉。 */
      creds: creds
    };
    out.sync.webdav = Object.assign({ url: '', user: '' }, out.sync.webdav || {});
    out.sync.github = Object.assign({ gistId: '' }, out.sync.github || {});
    // 兼容旧的读取方式：把凭据透到 sync 结构上（只读用）
    out.sync.webdav.pass = creds.webdavPass || '';
    out.sync.github.token = creds.githubToken || '';
    return out;
  };

  V.saveSettings = async function (s) {
    // ① 凭据单独存进安全存储
    const creds = Object.assign(await loadCreds(), {
      webdavPass: (s.creds && s.creds.webdavPass) ||
        (s.sync && s.sync.webdav && s.sync.webdav.pass) || '',
      githubToken: (s.creds && s.creds.githubToken) ||
        (s.sync && s.sync.github && s.sync.github.token) || ''
    });
    await saveCreds(creds);
    if (s.creds) { s.creds.webdavPass = creds.webdavPass; s.creds.githubToken = creds.githubToken; }

    // ② 配置写文件，且必须剥掉凭据
    const clean = {
      me: s.me,
      partner: s.partner,
      theme: s.theme,
      notify: s.notify,
      body: s.body,
      onboarded: s.onboarded,
      sync: {
        mode: s.sync.mode,
        autoOnOpen: s.sync.autoOnOpen,
        lastSyncAt: s.sync.lastSyncAt,
        webdav: { url: (s.sync.webdav || {}).url, user: (s.sync.webdav || {}).user },
        github: { gistId: (s.sync.github || {}).gistId }
      }
    };
    await g.P.mkdir(META);
    const r = await g.P.writeFile(META + '/settings.json', JSON.stringify(clean, null, 2));
    if (r && r.ok) {
      // 自检：确认明文凭据没有被写进去
      const chk = await g.P.readFile(META + '/settings.json');
      if (chk.ok && creds.webdavPass && chk.data.indexOf(creds.webdavPass) >= 0) {
        console.error('[settings] 严重：明文口令出现在 settings.json 中，请检查 saveSettings');
      }
    }
    return r;
  };

  g.V = V;
})(window);


/* ===== sync.js ===== */
/* =========================================================
   sync.js —— 同步引擎（你自己选后端，App 不碰你的数据）
   ---------------------------------------------------------
   三种模式，都是"你自己持有的存储"，没有中间服务器：

   ① 文件夹同步（推荐，最像 Obsidian）
      App 的文件就放在手机真实目录里，你用 Syncthing 把这个目录同步到电脑/另一台手机。
      数据不经过任何第三方。缺点：需要装 Syncthing（免费开源）。

   ② WebDAV（次推荐，最像 Joplin）
      坚果云 / Nextcloud / ownCloud / 自建。App 直接读写一个 JSON 包。
      国内用坚果云免费额度就够。

   ③ GitHub Gist
      免费、有版本历史。适合有点技术基础的人。

   合并策略：逐条按 updated 时间戳取新（last-write-wins）。
   这是刻意选的简单策略——两个人同时改同一条的概率很低，

          desc: '睡觉区间 ' + win.start + '–' + win.end + ' 的第一档。' +
                (isWork ? '明天还要早起。' : '今天不用早起，但别熬过头。') });

        if (s2) ics += vevent({ uid: 'sleep-' + key + '-end', start: s2, rrule: rrule,
          title: '已经过 ' + win.end + ' 了（' + (isWork ? '工作日' : '休息日') + '）',

        const s2 = toUTC(shiftIfWrap(iso, win.start, win.end), win.end);
        if (s2) ics += vevent({ uid: 'sleep-hol' + i + '-end', start: s2,

    if (n.sitEnabled) {
      N.everyTimes(n.sitStart || '09:00', n.sitEnd || '18:00', n.sitInterval || 60)
        .forEach(function (t, i) {
          const st = toUTC(today, t);
          if (!st) return;
          ics += vevent({ uid: 'sit' + i, start: st, rrule: 'FREQ=DAILY',
            title: '起来动一动',
            desc: '坐太久了。起来走 10~15 分钟，颈椎和腰会谢你。' });
        });

  /* ---------- 今日饮水 ---------- */

  function waterCard() {
    const d = A.day;
    const g = V.waterGoal(A.settings.body);
    // 今天的目标跟着身体参数走；历史日期保留当天的快照
    if (d.date === L.today() && d.water.goal !== g.goal) d.water.goal = g.goal;

    const done = d.water.done || 0;
    const goal = d.water.goal || g.goal;
    const pct = goal ? Math.min(100, Math.round(done / goal * 100)) : 0;

    // 三个快捷杯量：200 / 设定杯量 / 500，去重
    const cup = L.clamp(Number(A.settings.notify.waterCup) || 250, 100, 500);
    const opts = [];
    [200, cup, 500].forEach(function (c) { if (opts.indexOf(c) < 0) opts.push(c); });
    while (opts.length < 3) opts.push(opts[opts.length - 1] + 100);

    const logs = (d.water.logs || []).slice(-6).reverse().map(function (x) {
      return '<div>' + (x.t || '—') + ' · ' + x.ml + ' ml</div>';
    }).join('');

    return '' +
      '<div class="card">' +
      '<h3 class="card-h">今日饮水</h3>' +
      '<p class="card-note">' +
      '目标 ' + goal + ' ml（体表面积法算的，见设置）。' +
      (g.capped ? '<br><span style="color:var(--warn)">已按上限 ' + g.cap + ' ml 截断，再多就有水中毒风险。</span>' : '') +
      '</p>' +
      '<div class="water-top"><span class="water-cur">' + done + '</span>' +
      '<span class="water-goal">/ ' + goal + ' ml</span></div>' +
      '<div class="water-bar"><div class="water-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="water-pct">' + pct + '%' + (done >= goal && goal > 0 ? ' · 今天够了' : '') + '</div>' +
      '<div class="cups">' +
      opts.map(function (c) {
        return '<button class="btn" data-act="wa-add" data-ml="' + c + '">+' + c + '</button>';
      }).join('') +
      '</div>' +
      '<div class="row-wrap mt1">' +
      '<button class="btn ghost sm" data-act="wa-undo">撤销上一杯</button>' +
      '</div>' +
      (logs ? '<div class="water-logs">' + logs + '</div>' : '') +
      '</div>';
  }

  /* ---------- 久坐 / 起身活动 ---------- */

  function sitCard() {
    const d = A.day;
    const n = (d.activity.breaks || []).length;
    const mins = V.minutesSinceBreak(d);
    const iv = Number(A.settings.notify.sitInterval) || 60;

    let tip = '';
    if (mins == null && n === 0) {
      tip = '<div class="sit-warn">今天还没记过。想起来的时候就点一下。</div>';
    } else if (mins != null && mins >= iv) {
      tip = '<div class="sit-warn">距离上次起来已经 ' + mins + ' 分钟了，动一动。</div>';
    }

    return '' +
      '<div class="card">' +
      '<h3 class="card-h">起身活动</h3>' +
      '<p class="card-note">手机检测不到你坐着没有 —— 它只能定时提醒。' +

      '<div class="sit-row">' +
      '<span class="sit-num">' + n + '</span>' +
      '<span class="sit-lbl">次 · ' +

  A.openConflict = function (id) {
    let c = A.conflicts.find((x) => x.id === id);
    if (!c) { c = V.blankConflict(); A.conflicts.unshift(c); }
    const isNew = !c.title && !c.fact;
    const body = '' +
      '<label class="lbl">议题（一句话）</label>' +
      '<input class="input" id="cfTitle" value="' + L.esc(c.title) + '" placeholder="例：关于回复消息的速度">' +

      '<label class="lbl mt2">① 事实<span style="color:var(--ink3);font-weight:400"> · 只写发生的事，不写评价</span></label>' +
      '<textarea class="input" id="cfFact" placeholder="例：周三周四两天，我发的消息都是隔了六小时才回。">' + L.esc(c.fact) + '</textarea>' +

      '<textarea class="input" id="cfReq" placeholder="例：忙的时候先发一个「在忙，晚点聊」，可以吗？">' + L.esc(c.request) + '</textarea>' +

      '<label class="lbl mt2">' + L.esc(A.settings.partner) + '的回应</label>' +
      '<textarea class="input" id="cfResp" placeholder="对方看过之后写在这里（或由对方的设备同步过来）。">' + L.esc(c.response) + '</textarea>' +

      '<label class="lbl mt2">我们达成的约定</label>' +
      '<textarea class="input" id="cfPact" placeholder="例：工作日中午和晚上各回一次，忙的时候提前说一声。">' + L.esc(c.pact) + '</textarea>' +

      '<div class="grp-t">状态</div>' +
      '<div class="chips">' +
      Object.keys(STATUS_TXT).map(function (k) {
        return '<button class="chip' + (c.status === k ? ' on' : '') + '" data-act="cf-status" data-s="' + k + '">' + STATUS_TXT[k] + '</button>';
      }).join('') +
      '</div>' +
      '<div class="row-wrap mt2">' +
      '<button class="btn" data-act="cf-letter">转成一段能发出去的话</button>' +
      '<button class="btn ghost" data-act="cf-pause">暂停 20 分钟</button>' +
      '<button class="btn danger sm" data-act="cf-del">删除</button>' +
      '</div>';

    A.modal({
      title: isNew ? '新的议题' : '议题：' + (c.title || '未命名'),
      body: body,
      okText: '保存',
      onOk: async function () {
        c.title = L.$('#cfTitle').value.trim() || '未命名议题';
        c.fact = L.$('#cfFact').value;
        c.feeling = L.$('#cfFeel').value;
        c.need = L.$('#cfNeed').value;

        A.conflicts = await V.listConflicts();
        A.render();
        P.toast('已保存到 vault/conflicts/');
      }
    });
    A._curConflict = c;
  };
